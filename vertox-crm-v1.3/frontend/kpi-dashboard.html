<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donor &amp; Grant KPIs — Vertox CRM</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<script src="js/vendor/chart.umd.min.js"></script>
<style>
  .kpi-section-title{font-weight:700;font-size:15px;margin:22px 0 12px;color:var(--blue-800);}
  .kpi-section-title:first-child{margin-top:0;}
  .top-donor-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .top-donor-row:last-child{border-bottom:none;}
  .top-donor-rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--blue-50);color:var(--blue-700);font-weight:700;font-size:11px;margin-right:8px;}
  .status-pill-row{display:flex;flex-wrap:wrap;gap:8px;}
  .status-pill{padding:6px 12px;border-radius:20px;background:var(--blue-50);font-size:12.5px;font-weight:600;color:var(--blue-800);}
  .kpi-chart-card{height:260px;}
  .kpi-chart-card canvas{max-height:200px;}
  .campaign-row{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .campaign-row:last-child{border-bottom:none;}
  .campaign-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .campaign-progress-track{height:6px;border-radius:4px;background:var(--blue-50);overflow:hidden;}
  .campaign-progress-fill{height:100%;background:#2E7AE6;border-radius:4px;}
  .campaign-meta{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--text-muted,#6b7785);}
</style>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
  requireAuthPage();
  renderLayout('kpi-dashboard', 'Donor & Grant KPIs', 'Retention, top donors, grant utilization, and cost-per-beneficiary');
</script>

<template id="tpl">
  <div class="kpi-section-title">Donor KPIs</div>
  <div class="stat-grid" id="donorStats"></div>

  <div class="chart-grid" style="display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px;">
    <div class="card card-pad kpi-chart-card">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px;">Donations — Last 6 Months</div>
      <canvas id="trendChart"></canvas>
    </div>
    <div class="card card-pad" style="max-height:260px;overflow-y:auto;">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px;">Top Donors</div>
      <div id="topDonorsList"></div>
    </div>
  </div>

  <div class="kpi-section-title">Grant KPIs</div>
  <div class="stat-grid" id="grantStats"></div>
  <div class="card card-pad" style="margin-top:16px;">
    <div style="font-weight:700;font-size:13px;margin-bottom:10px;">Grants by Status</div>
    <div class="status-pill-row" id="grantStatusPills"></div>
  </div>

  <div class="kpi-section-title">Impact / Cost Efficiency</div>
  <div class="stat-grid" id="impactStats"></div>

  <div class="kpi-section-title">Campaign KPIs</div>
  <div class="stat-grid" id="campaignStats"></div>
  <div class="card card-pad" style="margin-top:16px;">
    <div style="font-weight:700;font-size:13px;margin-bottom:10px;">Campaign Progress &amp; ROI</div>
    <div id="campaignList"></div>
  </div>

  <div class="kpi-section-title">Results Chain — Input → Activity → Output → Outcome → Impact</div>
  <div class="card card-pad" style="margin-top:0;">
    <div id="impactChainWrap"></div>
  </div>
</template>

<script>
  let trendChartInstance = null;

  async function boot() {
    const root = document.getElementById('pageContent') || document.querySelector('.content');
    root.innerHTML = document.getElementById('tpl').innerHTML;
    await loadKpis();
  }

  function statCard(icon, num, label, accent) {
    return `<div class="stat-card ${accent || ''}"><div class="stat-icon">${icon}</div><div><div class="stat-num">${num}</div><div class="stat-label">${label}</div></div></div>`;
  }

  async function loadKpis() {
    try {
      const data = await api('/kpi/donor-grant');
      renderDonorStats(data.donor);
      renderGrantStats(data.grant);
      renderImpactStats(data.impact);
      renderTopDonors(data.donor.topDonors);
      renderTrendChart(data.donor.monthlyTrend);
      renderGrantStatusPills(data.grant.byStatus);

      const campData = await api('/kpi/campaigns');
      renderCampaignStats(campData.totals);
      renderCampaignList(campData.campaigns);

      const impactData = await api('/kpi/impact-chain');
      renderImpactChain(impactData.chain);
    } catch (e) {
      toast(e.message || 'Failed to load KPI dashboard', 'error');
    }
  }

  function renderImpactChain(chain) {
    const el = document.getElementById('impactChainWrap');
    if (!chain.some(c => c.indicatorCount > 0)) {
      el.innerHTML = '<div class="empty">No impact/outcome indicators recorded yet — add some in the Impact & Outcome Indicators module.</div>';
      return;
    }
    el.innerHTML = `
      <div style="display:flex;gap:0;overflow-x:auto;padding-bottom:8px;">
        ${chain.map((c, i) => `
          <div style="flex:1;min-width:150px;padding:14px;${i < chain.length - 1 ? 'border-right:1px dashed var(--line);' : ''}">
            <div style="font-size:11px;text-transform:uppercase;font-weight:700;color:var(--ink-faint);letter-spacing:0.5px;">${esc(c.level)}</div>
            <div style="font-size:22px;font-weight:800;margin-top:6px;">${c.achievementPercent !== null ? c.achievementPercent + '%' : '—'}</div>
            <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${c.achieved.toLocaleString()} / ${c.target.toLocaleString()}</div>
            <div style="font-size:11px;color:var(--ink-faint);margin-top:4px;">${c.indicatorCount} indicator${c.indicatorCount === 1 ? '' : 's'}</div>
          </div>
          ${i < chain.length - 1 ? '<div style="display:flex;align-items:center;color:var(--ink-faint);font-size:18px;padding:0 4px;">→</div>' : ''}
        `).join('')}
      </div>
    `;
  }

  function renderCampaignStats(t) {
    document.getElementById('campaignStats').innerHTML = [
      statCard(icon('target') || icon('chart') || '', t.activeCampaigns + ' / ' + t.totalCampaigns, 'Active / Total Campaigns'),
      statCard(icon('wallet') || '', formatCurrency(t.collectedAmount) + ' / ' + formatCurrency(t.targetAmount), 'Collected / Target'),
      statCard(icon('trend'), t.overallProgressPercent !== null ? t.overallProgressPercent + '%' : '—', 'Overall Progress', t.overallProgressPercent !== null && t.overallProgressPercent < 50 ? 'accent-amber' : ''),
      statCard(icon('trend'), t.overallRoiPercent !== null ? t.overallRoiPercent + '%' : '—', 'Overall ROI', t.overallRoiPercent !== null && t.overallRoiPercent < 0 ? 'accent-red' : 'accent-green')
    ].join('');
  }

  function renderCampaignList(list) {
    const el = document.getElementById('campaignList');
    if (!list.length) { el.innerHTML = '<div class="empty">No campaigns yet</div>'; return; }
    el.innerHTML = list.map(c => {
      const pct = c.progressPercent !== null ? Math.min(100, Math.max(0, c.progressPercent)) : 0;
      return `
      <div class="campaign-row">
        <div class="campaign-row-top">
          <strong>${esc(c.name)}</strong>
          <span class="status-pill">${esc(c.status)}</span>
        </div>
        <div class="campaign-progress-track"><div class="campaign-progress-fill" style="width:${pct}%"></div></div>
        <div class="campaign-meta">
          <span>Collected: ${formatCurrency(c.collected)}${c.target ? ' / ' + formatCurrency(c.target) : ''}</span>
          <span>Progress: ${c.progressPercent !== null ? c.progressPercent + '%' : '—'}</span>
          <span>ROI: ${c.roiPercent !== null ? c.roiPercent + '%' : '—'}</span>
          <span>Reach: ${c.reach.toLocaleString()}</span>
        </div>
      </div>`;
    }).join('');
  }

  function renderDonorStats(d) {
    document.getElementById('donorStats').innerHTML = [
      statCard(icon('user'), d.totalDonors, 'Unique Donors'),
      statCard(icon('gift') || '', formatCurrency(d.totalDonationAmount), 'Total Donations (net of refunds)', 'accent-green'),
      statCard(icon('wallet') || '', formatCurrency(d.avgDonation), 'Average Donation'),
      statCard(icon('trend'), d.retentionRate !== null ? d.retentionRate + '%' : '—', 'Donor Retention (YoY)', d.retentionRate !== null && d.retentionRate < 50 ? 'accent-amber' : '')
    ].join('');
  }

  function renderGrantStats(g) {
    document.getElementById('grantStats').innerHTML = [
      statCard(icon('award') || icon('gift') || '', g.totalGrants, 'Total Grants'),
      statCard(icon('wallet') || '', formatCurrency(g.totalApproved), 'Total Approved'),
      statCard(icon('wallet') || '', formatCurrency(g.totalSpent), 'Total Spent', g.totalSpent > g.totalApproved ? 'accent-red' : ''),
      statCard(icon('chart') || '', g.utilizationPercent !== null ? g.utilizationPercent + '%' : '—', 'Budget Utilization')
    ].join('');
  }

  function renderImpactStats(i) {
    document.getElementById('impactStats').innerHTML = [
      statCard(icon('user'), i.totalBeneficiaries.toLocaleString(), 'Total Beneficiaries Reached'),
      statCard(icon('wallet') || '', formatCurrency(i.totalSpendAllSources), 'Total Spend (Donations + Grants)'),
      statCard(icon('trend'), i.costPerBeneficiary !== null ? formatCurrency(i.costPerBeneficiary) : '—', 'Cost per Beneficiary')
    ].join('');
  }

  function renderTopDonors(list) {
    const el = document.getElementById('topDonorsList');
    if (!list.length) { el.innerHTML = '<div class="empty">No donation data yet</div>'; return; }
    el.innerHTML = list.map((d, i) => `
      <div class="top-donor-row">
        <span><span class="top-donor-rank">${i + 1}</span>${esc(d.name)}</span>
        <strong>${formatCurrency(d.total)}</strong>
      </div>
    `).join('');
  }

  function renderGrantStatusPills(byStatus) {
    const el = document.getElementById('grantStatusPills');
    const entries = Object.entries(byStatus || {});
    if (!entries.length) { el.innerHTML = '<div class="empty">No grants yet</div>'; return; }
    el.innerHTML = entries.map(([status, count]) => `<span class="status-pill">${esc(status)}: ${count}</span>`).join('');
  }

  function renderTrendChart(trend) {
    const ctx = document.getElementById('trendChart').getContext('2d');
    if (trendChartInstance) trendChartInstance.destroy();
    trendChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: trend.map(t => t.month),
        datasets: [{ label: 'Donations', data: trend.map(t => t.total), backgroundColor: '#2E7AE6', borderRadius: 4 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
      }
    });
  }

  boot();
</script>
</body>
</html>
