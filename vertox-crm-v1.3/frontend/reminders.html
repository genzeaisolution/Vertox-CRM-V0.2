<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recurring Donations — Vertox CRM</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
  requireAuthPage();
  renderLayout('reminders', 'Recurring Donations', 'Schedules run automatically — the system generates a reminder itself when a donation cycle is due, no manual checking needed');
</script>

<template id="tpl">
  <div class="tabs">
    <button class="tab-btn active" data-tab="reminders" onclick="switchTab('reminders')">Due Reminders</button>
    <button class="tab-btn" data-tab="schedules" onclick="switchTab('schedules')">Schedules</button>
  </div>

  <div id="summaryGrid" class="stat-grid"></div>

  <!-- ===== Reminders tab ===== -->
  <div id="tab-reminders">
    <div class="toolbar">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <select class="select" id="fRemStatus" style="width:160px;">
          <option value="">All statuses</option>
          <option>Pending</option><option>Sent</option><option>Collected</option><option>Dismissed</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="loadReminders()">Apply</button>
      </div>
      <button class="btn btn-outline" id="sweepBtn" onclick="runSweep()">Check for due reminders now</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Due Date</th><th>Donor</th><th>Amount</th><th>Frequency</th><th>Status</th><th></th></tr></thead>
        <tbody id="remindersBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ===== Schedules tab ===== -->
  <div id="tab-schedules" class="hidden">
    <div class="toolbar">
      <div class="page-sub" style="font-size:12.5px;color:var(--ink-soft);">Every Active schedule is checked automatically once a day — a reminder is generated by itself when its Next Due date arrives, and the date advances to the next cycle on its own.</div>
      <button class="btn btn-primary" id="newScheduleBtn" onclick="openScheduleModal()">+ New Recurring Schedule</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Donor</th><th>Amount</th><th>Frequency</th><th>Next Due</th><th>Status</th><th></th></tr></thead>
        <tbody id="schedulesBody"></tbody>
      </table>
    </div>
  </div>
</template>

<!-- Schedule modal -->
<div class="modal-overlay hidden" id="scheduleModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="scheduleModalTitle">New Recurring Schedule</div>
      <button class="close-x" onclick="closeScheduleModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="sc_id">
      <div class="field"><label class="label">Donor Name *</label><input class="input" id="sc_donor" data-field="donorName"></div>
      <div class="field"><label class="label">Amount *</label><input class="input" type="number" step="0.01" id="sc_amount" data-field="amount"></div>
      <div class="field"><label class="label">Currency</label><select class="select" id="sc_currency" data-field="currencyCode"><option value="">(default)</option></select></div>
      <div class="field"><label class="label">Frequency *</label>
        <select class="select" id="sc_frequency" data-field="frequency">
          <option>Weekly</option><option selected>Monthly</option><option>Quarterly</option><option>Yearly</option>
        </select>
      </div>
      <div class="field"><label class="label">Start Date *</label><input class="input" type="date" id="sc_start" data-field="startDate"></div>
      <div class="field" id="sc_statusField" style="display:none;"><label class="label">Status</label>
        <select class="select" id="sc_status" data-field="status"><option>Active</option><option>Paused</option><option>Cancelled</option></select>
      </div>
      <div class="field"><label class="label">Notes</label><textarea class="textarea" rows="2" id="sc_notes" data-field="notes"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeScheduleModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSchedule()">Save</button>
    </div>
  </div>
</div>

<script>
  document.getElementById('pageContent').innerHTML = document.getElementById('tpl').innerHTML;

  const user = Store.user || {};
  const perms = user.permissions || [];
  const canManage = user.role === 'SuperAdmin' || perms.includes('reminders.manage');
  if (!canManage) document.getElementById('newScheduleBtn')?.classList.add('hidden');

  let reminders = [], schedules = [], currencies = [];

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.getElementById('tab-reminders').classList.toggle('hidden', tab !== 'reminders');
    document.getElementById('tab-schedules').classList.toggle('hidden', tab !== 'schedules');
  }

  async function loadCurrencies() {
    try {
      currencies = await api('/ledger/currencies');
      document.getElementById('sc_currency').innerHTML = `<option value="">(default)</option>` + currencies.map(c => `<option value="${esc(c.CurrencyCode)}">${esc(c.CurrencyCode)}</option>`).join('');
    } catch (e) { /* ledger.view might not be granted to this role — non-critical here */ }
  }

  function moneyFmt(amount, code) {
    if (amount === undefined || amount === null) return '—';
    try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: code || SiteSettings.currency_code || 'USD', maximumFractionDigits: 2 }).format(Number(amount)); }
    catch (e) { return Number(amount).toFixed(2) + ' ' + (code || ''); }
  }

  function renderSummary() {
    const pending = reminders.filter(r => r.Status === 'Pending').length;
    const activeSchedules = schedules.filter(s => s.Status === 'Active').length;
    const overdue = reminders.filter(r => r.Status === 'Pending' && new Date(r.DueDate) < new Date(new Date().toDateString())).length;
    document.getElementById('summaryGrid').innerHTML = `
      <div class="stat-card"><div class="stat-num" style="color:var(--warn)">${pending}</div><div class="stat-label">Pending Reminders</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--danger)">${overdue}</div><div class="stat-label">Overdue</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--success)">${activeSchedules}</div><div class="stat-label">Active Schedules</div></div>
      <div class="stat-card"><div class="stat-num">${schedules.length}</div><div class="stat-label">Total Schedules</div></div>
    `;
  }

  async function loadReminders() {
    try {
      const params = {};
      const status = document.getElementById('fRemStatus').value; if (status) params.status = status;
      const qs = new URLSearchParams(params).toString();
      reminders = await api('/reminders' + (qs ? '?' + qs : ''));
      renderSummary();
      const body = document.getElementById('remindersBody');
      if (reminders.length === 0) { body.innerHTML = `<tr><td colspan="6" class="empty">No reminders yet — they generate automatically as schedules come due</td></tr>`; return; }
      const badge = { Pending: 'badge-blue', Sent: 'badge-gray', Collected: 'badge-green', Dismissed: 'badge-red' };
      body.innerHTML = reminders.map(r => `
        <tr>
          <td>${new Date(r.DueDate).toLocaleDateString()}</td>
          <td>${esc(r.DonorName)}</td>
          <td>${moneyFmt(r.Amount, r.CurrencyCode)}</td>
          <td>${esc(r.Frequency)}</td>
          <td><span class="badge ${badge[r.Status] || 'badge-gray'}">${esc(r.Status)}</span></td>
          <td style="text-align:right;">
            ${canManage && r.Status === 'Pending' ? `
              <button class="btn btn-outline btn-sm" onclick="actionReminder(${r.ReminderId},'Sent')">Mark Sent</button>
              <button class="btn btn-primary btn-sm" onclick="actionReminder(${r.ReminderId},'Collected')">Mark Collected</button>
              <button class="btn btn-danger btn-sm" onclick="actionReminder(${r.ReminderId},'Dismissed')">Dismiss</button>` : ''}
          </td>
        </tr>
      `).join('');
    } catch (e) { toast(e.message, 'error'); }
  }

  async function actionReminder(id, status) {
    try { await api('/reminders/' + id + '/action', { method: 'PUT', body: { status } }); toast('Reminder updated', 'success'); loadReminders(); }
    catch (e) { toast(e.message, 'error'); }
  }

  async function runSweep() {
    const btn = document.getElementById('sweepBtn');
    btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Checking...';
    try {
      const r = await api('/reminders/run-sweep', { method: 'POST' });
      toast(`Checked ${r.checked} schedule(s), generated ${r.generated} reminder(s)`, 'success');
      loadReminders(); loadSchedules();
    } catch (e) { toast(e.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = orig; }
  }

  async function loadSchedules() {
    try {
      schedules = await api('/reminders/schedules');
      renderSummary();
      const body = document.getElementById('schedulesBody');
      if (schedules.length === 0) { body.innerHTML = `<tr><td colspan="6" class="empty">No recurring schedules yet</td></tr>`; return; }
      const badge = { Active: 'badge-green', Paused: 'badge-gray', Cancelled: 'badge-red' };
      body.innerHTML = schedules.map(s => `
        <tr>
          <td>${esc(s.DonorName)}</td>
          <td>${moneyFmt(s.Amount, s.CurrencyCode)}</td>
          <td>${esc(s.Frequency)}</td>
          <td>${new Date(s.NextDueDate).toLocaleDateString()}</td>
          <td><span class="badge ${badge[s.Status] || 'badge-gray'}">${esc(s.Status)}</span></td>
          <td style="text-align:right;">
            ${canManage ? `<button class="btn btn-outline btn-sm" onclick="editSchedule(${s.ScheduleId})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteSchedule(${s.ScheduleId})">Delete</button>` : ''}
          </td>
        </tr>
      `).join('');
    } catch (e) { toast(e.message, 'error'); }
  }

  function todayStr() { return new Date().toISOString().slice(0, 10); }

  function openScheduleModal() {
    document.getElementById('scheduleModalTitle').textContent = 'New Recurring Schedule';
    document.getElementById('sc_id').value = '';
    document.getElementById('sc_donor').value = '';
    document.getElementById('sc_amount').value = '';
    document.getElementById('sc_currency').value = '';
    document.getElementById('sc_frequency').value = 'Monthly';
    document.getElementById('sc_start').value = todayStr();
    document.getElementById('sc_notes').value = '';
    document.getElementById('sc_statusField').style.display = 'none';
    document.getElementById('scheduleModalOverlay').classList.remove('hidden');
  }
  function closeScheduleModal() { document.getElementById('scheduleModalOverlay').classList.add('hidden'); }

  function editSchedule(id) {
    const s = schedules.find(x => x.ScheduleId === id);
    if (!s) return;
    document.getElementById('scheduleModalTitle').textContent = 'Edit Schedule';
    document.getElementById('sc_id').value = s.ScheduleId;
    document.getElementById('sc_donor').value = s.DonorName;
    document.getElementById('sc_amount').value = s.Amount;
    document.getElementById('sc_currency').value = s.CurrencyCode || '';
    document.getElementById('sc_frequency').value = s.Frequency;
    document.getElementById('sc_start').value = new Date(s.StartDate).toISOString().slice(0, 10);
    document.getElementById('sc_notes').value = s.Notes || '';
    document.getElementById('sc_statusField').style.display = '';
    document.getElementById('sc_status').value = s.Status;
    document.getElementById('scheduleModalOverlay').classList.remove('hidden');
  }

  async function saveSchedule() {
    const id = document.getElementById('sc_id').value;
    const btn = document.querySelector('#scheduleModalOverlay .btn-primary');
    if (btn.disabled) return;
    const payload = {
      donorName: document.getElementById('sc_donor').value.trim(),
      amount: document.getElementById('sc_amount').value,
      currencyCode: document.getElementById('sc_currency').value || null,
      frequency: document.getElementById('sc_frequency').value,
      startDate: document.getElementById('sc_start').value,
      notes: document.getElementById('sc_notes').value.trim()
    };
    if (id) payload.status = document.getElementById('sc_status').value;
    btn.disabled = true;
    try {
      if (id) { await api('/reminders/schedules/' + id, { method: 'PUT', body: payload }); toast('Schedule updated', 'success'); }
      else { await api('/reminders/schedules', { method: 'POST', body: payload }); toast('Recurring schedule created', 'success'); }
      closeScheduleModal(); loadSchedules();
    } catch (e) { showFormErrors(e); }
    finally { btn.disabled = false; }
  }

  async function deleteSchedule(id) {
    if (!confirm('Delete this recurring schedule? Future reminders will stop generating.')) return;
    try { await api('/reminders/schedules/' + id, { method: 'DELETE' }); toast('Schedule deleted', 'success'); loadSchedules(); }
    catch (e) { toast(e.message, 'error'); }
  }

  function showFormErrors(e) {
    document.querySelectorAll('.field-error').forEach(el => el.remove());
    document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
    const errors = e.errors || {};
    let matched = false;
    Object.entries(errors).forEach(([key, msg]) => {
      const el = document.querySelector(`[data-field="${key}"]`);
      if (el) {
        matched = true;
        el.classList.add('input-error');
        const hint = document.createElement('div');
        hint.className = 'field-error';
        hint.textContent = msg;
        el.insertAdjacentElement('afterend', hint);
      }
    });
    toast(matched ? 'Please fix the highlighted fields' : e.message, 'error');
  }

  (async function init() {
    await loadCurrencies();
    await loadReminders();
    await loadSchedules();
  })();
</script>
</body>
</html>
