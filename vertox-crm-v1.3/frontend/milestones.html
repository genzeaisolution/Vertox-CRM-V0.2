<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grant Milestones — Vertox CRM</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
  requireAuthPage();
  renderLayout('milestones', 'Grant Milestones', 'Break every grant into trackable milestones / sub-tasks with due dates');
</script>

<template id="tpl">
  <div id="summaryGrid" class="stat-grid"></div>
  <div class="toolbar">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <select class="select" id="fGrant" style="width:220px;"><option value="">All grants</option></select>
      <button class="btn btn-primary btn-sm" onclick="loadMilestones()">Apply</button>
      <button class="btn btn-outline btn-sm" onclick="clearFilters()">Clear</button>
    </div>
    <button class="btn btn-primary" id="newMilestoneBtn" onclick="openMilestoneModal()">+ New Milestone</button>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>Grant</th><th>Milestone</th><th>Due Date</th><th>Status</th><th></th></tr></thead>
      <tbody id="milestonesBody"></tbody>
    </table>
  </div>
</template>

<div class="modal-overlay hidden" id="milestoneModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="milestoneModalTitle">New Milestone</div>
      <button class="close-x" onclick="closeMilestoneModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="m_id">
      <div class="field"><label class="label">Grant *</label><select class="select" id="m_grant" data-field="grantRecordId"></select></div>
      <div class="field"><label class="label">Milestone Title *</label><input class="input" id="m_title" data-field="title" placeholder="e.g. Submit Q1 progress report"></div>
      <div class="field"><label class="label">Due Date</label><input class="input" type="date" id="m_due" data-field="dueDate"></div>
      <div class="field"><label class="label">Status</label>
        <select class="select" id="m_status" data-field="status">
          <option>Pending</option><option>In Progress</option><option>Completed</option>
        </select>
      </div>
      <div class="field"><label class="label">Description</label><textarea class="textarea" rows="3" id="m_desc" data-field="description"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeMilestoneModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveMilestone()">Save</button>
    </div>
  </div>
</div>

<script>
  document.getElementById('pageContent').innerHTML = document.getElementById('tpl').innerHTML;

  const user = Store.user || {};
  const perms = user.permissions || [];
  const canManage = user.role === 'SuperAdmin' || perms.includes('milestones.manage');
  if (!canManage) document.getElementById('newMilestoneBtn')?.classList.add('hidden');

  let milestones = [], grants = [];

  async function loadOptions() {
    grants = await api('/milestones/grants');
    document.getElementById('m_grant').innerHTML = grants.map(g => `<option value="${g.RecordId}">${esc(g.Title) || '(untitled #' + g.RecordId + ')'}</option>`).join('') || `<option value="">No grants yet — add one in the Grants module first</option>`;
    document.getElementById('fGrant').innerHTML = `<option value="">All grants</option>` + grants.map(g => `<option value="${g.RecordId}">${esc(g.Title)}</option>`).join('');
  }

  function renderSummary() {
    const total = milestones.length;
    const completed = milestones.filter(m => m.ComputedStatus === 'Completed').length;
    const overdue = milestones.filter(m => m.ComputedStatus === 'Overdue').length;
    const pending = total - completed - overdue;
    document.getElementById('summaryGrid').innerHTML = `
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total Milestones</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--success)">${completed}</div><div class="stat-label">Completed</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--warn)">${pending}</div><div class="stat-label">In Progress / Pending</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--danger)">${overdue}</div><div class="stat-label">Overdue</div></div>
    `;
  }

  async function loadMilestones() {
    try {
      const params = {};
      const grant = document.getElementById('fGrant').value; if (grant) params.grantRecordId = grant;
      const qs = new URLSearchParams(params).toString();
      milestones = await api('/milestones' + (qs ? '?' + qs : ''));
      renderSummary();
      const body = document.getElementById('milestonesBody');
      if (milestones.length === 0) { body.innerHTML = `<tr><td colspan="5" class="empty">No milestones yet</td></tr>`; return; }
      const statusBadge = { Pending: 'badge-gray', 'In Progress': 'badge-blue', Completed: 'badge-green', Overdue: 'badge-red' };
      body.innerHTML = milestones.map(m => `
        <tr>
          <td>${esc(m.GrantName) || '—'}</td>
          <td>${esc(m.Title)}</td>
          <td>${m.DueDate ? new Date(m.DueDate).toLocaleDateString() : '—'}</td>
          <td><span class="badge ${statusBadge[m.ComputedStatus] || 'badge-gray'}">${esc(m.ComputedStatus)}</span></td>
          <td style="text-align:right;">
            ${canManage ? `<button class="btn btn-outline btn-sm" onclick="editMilestone(${m.MilestoneId})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteMilestone(${m.MilestoneId})">Delete</button>` : ''}
          </td>
        </tr>
      `).join('');
    } catch (e) { toast(e.message, 'error'); }
  }

  function clearFilters() { document.getElementById('fGrant').value = ''; loadMilestones(); }

  function openMilestoneModal() {
    document.getElementById('milestoneModalTitle').textContent = 'New Milestone';
    document.getElementById('m_id').value = '';
    document.getElementById('m_grant').value = grants[0]?.RecordId || '';
    document.getElementById('m_title').value = '';
    document.getElementById('m_due').value = '';
    document.getElementById('m_status').value = 'Pending';
    document.getElementById('m_desc').value = '';
    document.getElementById('milestoneModalOverlay').classList.remove('hidden');
  }
  function closeMilestoneModal() { document.getElementById('milestoneModalOverlay').classList.add('hidden'); }

  function editMilestone(id) {
    const m = milestones.find(x => x.MilestoneId === id);
    if (!m) return;
    document.getElementById('milestoneModalTitle').textContent = 'Edit Milestone';
    document.getElementById('m_id').value = m.MilestoneId;
    document.getElementById('m_grant').value = m.GrantRecordId;
    document.getElementById('m_title').value = m.Title;
    document.getElementById('m_due').value = m.DueDate ? new Date(m.DueDate).toISOString().slice(0, 10) : '';
    document.getElementById('m_status').value = m.Status;
    document.getElementById('m_desc').value = m.Description || '';
    document.getElementById('milestoneModalOverlay').classList.remove('hidden');
  }

  async function saveMilestone() {
    const id = document.getElementById('m_id').value;
    const btn = document.querySelector('#milestoneModalOverlay .btn-primary');
    if (btn.disabled) return;
    const payload = {
      grantRecordId: Number(document.getElementById('m_grant').value) || null,
      title: document.getElementById('m_title').value.trim(),
      dueDate: document.getElementById('m_due').value || null,
      status: document.getElementById('m_status').value,
      description: document.getElementById('m_desc').value.trim()
    };
    btn.disabled = true;
    try {
      if (id) { await api('/milestones/' + id, { method: 'PUT', body: payload }); toast('Milestone updated', 'success'); }
      else { await api('/milestones', { method: 'POST', body: payload }); toast('Milestone created', 'success'); }
      closeMilestoneModal(); loadMilestones();
    } catch (e) { showFormErrors(e); }
    finally { btn.disabled = false; }
  }

  async function deleteMilestone(id) {
    if (!confirm('Delete this milestone?')) return;
    try { await api('/milestones/' + id, { method: 'DELETE' }); toast('Milestone deleted', 'success'); loadMilestones(); }
    catch (e) { toast(e.message, 'error'); }
  }

  function showFormErrors(e) {
    document.querySelectorAll('.field-error').forEach(el => el.remove());
    document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
    const errors = e.errors || {};
    let matched = false;
    Object.entries(errors).forEach(([key, msg]) => {
      const el = document.querySelector(`[data-field="${key}"]`);
      if (el) {
        matched = true;
        el.classList.add('input-error');
        const hint = document.createElement('div');
        hint.className = 'field-error';
        hint.textContent = msg;
        el.insertAdjacentElement('afterend', hint);
      }
    });
    toast(matched ? 'Please fix the highlighted fields' : e.message, 'error');
  }

  (async function init() {
    await loadOptions();
    await loadMilestones();
  })();
</script>
</body>
</html>
