<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Vertox CRM</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
  requireAuthPage();
  renderLayout('settings', 'Settings', 'Global system settings — update from here, no code changes needed');
</script>

<template id="tpl">
  <div class="card card-pad" style="max-width:520px;">
    <div class="field">
      <label class="label">Site / Company Name</label>
      <input class="input" id="s_siteName">
    </div>
    <div class="field">
      <label class="label">Theme Color</label>
      <select class="select" id="s_theme">
        <option value="blue">Blue (default)</option>
        <option value="white">White / Minimal</option>
      </select>
    </div>
    <div class="field">
      <label class="label">Currency</label>
      <select class="select" id="s_currency">
        <option value="USD">US Dollar (USD $)</option>
        <option value="PKR">Pakistani Rupee (PKR ₨)</option>
        <option value="EUR">Euro (EUR €)</option>
        <option value="GBP">British Pound (GBP £)</option>
        <option value="AED">UAE Dirham (AED د.إ)</option>
        <option value="SAR">Saudi Riyal (SAR ﷼)</option>
        <option value="INR">Indian Rupee (INR ₹)</option>
      </select>
      <div style="font-size:11.5px;color:var(--ink-faint);margin-top:6px;">
        Applies to every "Currency" field across all modules, reports and dashboard KPIs.
      </div>
    </div>
    <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
  </div>
</template>

<script>
  document.getElementById('pageContent').innerHTML = document.getElementById('tpl').innerHTML;

  const CURRENCY_LOCALE = { USD: 'en-US', PKR: 'en-PK', EUR: 'de-DE', GBP: 'en-GB', AED: 'ar-AE', SAR: 'ar-SA', INR: 'en-IN' };

  async function load() {
    try {
      const s = await api('/settings');
      document.getElementById('s_siteName').value = s.site_name || 'Vertox CRM';
      document.getElementById('s_theme').value = s.theme_color || 'blue';
      document.getElementById('s_currency').value = s.currency_code || 'USD';
    } catch (e) { toast(e.message, 'error'); }
  }

  async function saveSettings() {
    try {
      const currency = document.getElementById('s_currency').value;
      await api('/settings', { method: 'PUT', body: {
        site_name: document.getElementById('s_siteName').value.trim(),
        theme_color: document.getElementById('s_theme').value,
        currency_code: currency,
        currency_locale: CURRENCY_LOCALE[currency] || 'en-US'
      }});
      toast('Settings saved', 'success');
    } catch (e) { toast(e.message, 'error'); }
  }

  load();
</script>
</body>
</html>
