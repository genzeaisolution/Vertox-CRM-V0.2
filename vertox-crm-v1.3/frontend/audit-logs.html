<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Trail — Vertox CRM</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .filter-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px;}
  .filter-field{min-width:170px;}
  .filter-field .label{margin-bottom:5px;}
  .details-cell{max-width:340px;font-size:12px;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word;}
  .action-tag{font-family:monospace;font-size:12px;background:var(--blue-50);color:var(--blue-700);padding:2px 7px;border-radius:6px;}
  .diff-row{display:flex;gap:6px;}
  .diff-before{color:#b91c1c;text-decoration:line-through;}
  .diff-after{color:#15803d;}
  .device-cell{font-size:12px;color:var(--ink-soft);}
  .ip-cell{font-family:monospace;font-size:12px;}
  .audit-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .audit-tabs button.active{background:var(--primary,#1B63C4);color:#fff;border-color:transparent;}
</style>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
  requireAuthPage();
  renderLayout('audit', 'Audit Trail', 'Every create, update, delete and login event — sourced live from the database');
</script>

<template id="tpl">
  <div class="audit-tabs">
    <button class="btn btn-outline active" id="tabTrail" onclick="switchAuditTab('trail')">Audit Trail</button>
    <button class="btn btn-outline" id="tabLogin" onclick="switchAuditTab('login')">Login History</button>
  </div>

  <div id="trailSection">
  <div class="card card-pad" style="margin-bottom:18px;">
    <div class="filter-bar">
      <div class="filter-field">
        <label class="label">User</label>
        <select class="select" id="af_user"><option value="">All users</option></select>
      </div>
      <div class="filter-field">
        <label class="label">Action</label>
        <select class="select" id="af_action"><option value="">All actions</option></select>
      </div>
      <div class="filter-field">
        <label class="label">Module</label>
        <select class="select" id="af_module"><option value="">All modules</option></select>
      </div>
      <div class="filter-field">
        <label class="label">From</label>
        <input class="input" type="date" id="af_from">
      </div>
      <div class="filter-field">
        <label class="label">To</label>
        <input class="input" type="date" id="af_to">
      </div>
      <div class="filter-field" style="flex:1;min-width:200px;">
        <label class="label">Search</label>
        <input class="input" id="af_q" placeholder="Search action, details, username..." onkeydown="if(event.key==='Enter')runAudit()">
      </div>
      <div class="filter-field">
        <button class="btn btn-primary" onclick="runAudit()">Apply</button>
      </div>
      <div class="filter-field">
        <button class="btn btn-outline" onclick="clearAuditFilters()">Clear</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr><th>Time</th><th>User</th><th>Action</th><th>Module</th><th>Record</th><th>Changes</th><th>IP Address</th><th>Device</th></tr>
      </thead>
      <tbody id="auditBody"></tbody>
    </table>
    </div>
  </div>
  </div>

  <div id="loginSection" class="hidden">
    <div class="card card-pad" style="margin-bottom:18px;">
      <div class="filter-bar">
        <div class="filter-field">
          <label class="label">Result</label>
          <select class="select" id="lh_status">
            <option value="">All</option>
            <option value="success">Successful logins</option>
            <option value="failed">Failed attempts</option>
            <option value="logout">Logouts</option>
          </select>
        </div>
        <div class="filter-field">
          <label class="label">From</label>
          <input class="input" type="date" id="lh_from">
        </div>
        <div class="filter-field">
          <label class="label">To</label>
          <input class="input" type="date" id="lh_to">
        </div>
        <div class="filter-field">
          <button class="btn btn-primary" onclick="runLoginHistory()">Apply</button>
        </div>
      </div>
      <div class="muted-note" style="color:#8a94a6;font-size:12.5px;margin-top:6px;">Defaults to the last 90 days. Failed attempts against unknown usernames show with no "User" (there's no account to attach them to) but still record the IP/device — useful for spotting brute-force attempts.</div>
    </div>
    <div class="card">
      <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr><th>Time</th><th>User</th><th>Result</th><th>Reason</th><th>IP Address</th><th>Device</th></tr>
        </thead>
        <tbody id="loginBody"></tbody>
      </table>
      </div>
    </div>
  </div>
</template>

<script>
  document.getElementById('pageContent').innerHTML = document.getElementById('tpl').innerHTML;

  async function init() {
    try {
      const filters = await api('/audit/filters');
      document.getElementById('af_user').innerHTML += filters.users.map(u =>
        `<option value="${u.UserId}">${esc(u.FullName || u.Username)}</option>`).join('');
      document.getElementById('af_action').innerHTML += filters.actions.map(a =>
        `<option value="${esc(a)}">${esc(a)}</option>`).join('');
      document.getElementById('af_module').innerHTML += filters.modules.map(m =>
        `<option value="${esc(m)}">${esc(m)}</option>`).join('');
      runAudit();
    } catch (e) { toast(e.message, 'error'); }
  }

  function buildQuery() {
    const userId = document.getElementById('af_user').value;
    const action = document.getElementById('af_action').value;
    const module = document.getElementById('af_module').value;
    const from = document.getElementById('af_from').value;
    const to = document.getElementById('af_to').value;
    const q = document.getElementById('af_q').value.trim();
    const parts = [];
    if (userId) parts.push('userId=' + encodeURIComponent(userId));
    if (action) parts.push('action=' + encodeURIComponent(action));
    if (module) parts.push('module=' + encodeURIComponent(module));
    if (from) parts.push('from=' + encodeURIComponent(from));
    if (to) parts.push('to=' + encodeURIComponent(to));
    if (q) parts.push('q=' + encodeURIComponent(q));
    return parts.length ? '?' + parts.join('&') : '';
  }

  async function runAudit() {
    try {
      const logs = await api('/audit' + buildQuery());
      const body = document.getElementById('auditBody');
      if (logs.length === 0) {
        body.innerHTML = `<tr><td colspan="8" class="empty">No activity found for these filters</td></tr>`;
        return;
      }
      body.innerHTML = logs.map(l => `
        <tr>
          <td>${new Date(l.CreatedAt).toLocaleString()}</td>
          <td>${esc(l.FullName || l.Username) || '—'}</td>
          <td><span class="action-tag">${esc(l.Action)}</span></td>
          <td>${l.Module ? `<span class="badge badge-blue">${esc(l.Module)}</span>` : '—'}</td>
          <td>${esc(l.RecordId) || '—'}</td>
          <td class="details-cell">${formatDetails(l.Details)}</td>
          <td class="ip-cell">${esc(l.IpAddress) || '—'}</td>
          <td class="device-cell" title="${esc(l.UserAgent) || ''}">${esc(describeDevice(l.UserAgent))}</td>
        </tr>
      `).join('');
    } catch (e) { toast(e.message, 'error'); }
  }

  // Renders a compact before -> after diff when Details carries {before, after}
  // (record.update entries), otherwise falls back to flat key: value pairs.
  function formatDetails(raw) {
    if (!raw) return '—';
    let obj;
    try { obj = JSON.parse(raw); } catch (e) { return esc(raw); }
    if (obj && obj.before && obj.after && Object.keys(obj.before).length) {
      const rows = Object.keys(obj.before).map(k => `
        <div class="diff-row"><b>${esc(k)}:</b>
          <span class="diff-before">${esc(formatDiffVal(obj.before[k]))}</span>
          <span>→</span>
          <span class="diff-after">${esc(formatDiffVal(obj.after[k]))}</span>
        </div>`).join('');
      return rows || '—';
    }
    return Object.entries(obj).map(([k, v]) => `${esc(k)}: ${esc(formatDiffVal(v))}`).join(', ') || '—';
  }

  function formatDiffVal(v) {
    if (v === null || v === undefined || v === '') return '(empty)';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }

  // Very small, dependency-free User-Agent -> "Browser on OS" label. Good
  // enough for "which device did this come from" at a glance; the full raw
  // string is still available on hover via the title attribute.
  function describeDevice(ua) {
    if (!ua) return '—';
    let os = 'Unknown OS';
    if (/Windows/i.test(ua)) os = 'Windows';
    else if (/Mac OS X/i.test(ua)) os = 'macOS';
    else if (/Android/i.test(ua)) os = 'Android';
    else if (/iPhone|iPad|iOS/i.test(ua)) os = 'iOS';
    else if (/Linux/i.test(ua)) os = 'Linux';

    let browser = 'Unknown Browser';
    if (/Edg\//i.test(ua)) browser = 'Edge';
    else if (/Chrome\//i.test(ua) && !/Chromium/i.test(ua)) browser = 'Chrome';
    else if (/Firefox\//i.test(ua)) browser = 'Firefox';
    else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';
    else if (/curl|Postman|axios|node-fetch/i.test(ua)) browser = 'API client';

    return `${browser} on ${os}`;
  }

  function clearAuditFilters() {
    document.getElementById('af_user').value = '';
    document.getElementById('af_action').value = '';
    document.getElementById('af_module').value = '';
    document.getElementById('af_from').value = '';
    document.getElementById('af_to').value = '';
    document.getElementById('af_q').value = '';
    runAudit();
  }

  // ===== Login History tab =====
  function switchAuditTab(tab) {
    document.getElementById('tabTrail').classList.toggle('active', tab === 'trail');
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('trailSection').classList.toggle('hidden', tab !== 'trail');
    document.getElementById('loginSection').classList.toggle('hidden', tab !== 'login');
    if (tab === 'login') runLoginHistory();
  }

  function loginHistoryQuery() {
    const status = document.getElementById('lh_status').value;
    const from = document.getElementById('lh_from').value;
    const to = document.getElementById('lh_to').value;
    const parts = [];
    if (status) parts.push('status=' + encodeURIComponent(status));
    if (from) parts.push('from=' + encodeURIComponent(from));
    if (to) parts.push('to=' + encodeURIComponent(to));
    return parts.length ? '?' + parts.join('&') : '';
  }

  async function runLoginHistory() {
    try {
      const logs = await api('/audit/login-history' + loginHistoryQuery());
      const body = document.getElementById('loginBody');
      if (logs.length === 0) {
        body.innerHTML = `<tr><td colspan="6" class="empty">No login activity found for these filters</td></tr>`;
        return;
      }
      body.innerHTML = logs.map(l => {
        let details = {};
        try { details = l.Details ? JSON.parse(l.Details) : {}; } catch (e) { /* ignore */ }
        const isFailed = l.Action === 'login.failed';
        const isLogout = l.Action === 'logout';
        const resultBadge = isFailed
          ? `<span class="badge badge-red">Failed</span>`
          : isLogout ? `<span class="badge">Logout</span>` : `<span class="badge badge-green">Success</span>`;
        const reason = isFailed ? esc((details.reason || '').replace(/_/g, ' ')) : '—';
        return `
        <tr>
          <td>${new Date(l.CreatedAt).toLocaleString()}</td>
          <td>${esc(l.FullName || l.Username || details.username) || '—'}</td>
          <td>${resultBadge}</td>
          <td>${reason}</td>
          <td class="ip-cell">${esc(l.IpAddress) || '—'}</td>
          <td class="device-cell" title="${esc(l.UserAgent) || ''}">${esc(describeDevice(l.UserAgent))}</td>
        </tr>`;
      }).join('');
    } catch (e) { toast(e.message, 'error'); }
  }

  init();
</script>
</body>
</html>
