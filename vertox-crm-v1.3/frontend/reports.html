<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Vertox CRM</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<!-- Export libraries: CSV/Excel + PDF generation happen entirely client-side -->
<script src="js/vendor/xlsx.full.min.js"></script>
<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/vendor/jspdf.plugin.autotable.min.js"></script>
<script src="js/vendor/chart.umd.min.js"></script>
<style>
  .filter-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px;}
  .filter-field{min-width:170px;}
  .filter-field .label{margin-bottom:5px;}
  .export-bar{display:flex;gap:8px;margin-left:auto;}
  .report-summary{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .report-summary .stat-card{flex:1;min-width:150px;}
  .report-table-wrap{overflow-x:auto;}
  .trend-card{height:230px;margin-bottom:18px;}
  .trend-card canvas{max-height:170px;}
  .kpi-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .kpi-tabs button.active{background:var(--primary,#1B63C4);color:#fff;border-color:transparent;}
  .kpi-grid{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .kpi-grid .stat-card{flex:1;min-width:170px;}
  .kpi-cols{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-bottom:18px;}
  @media (max-width:900px){.kpi-cols{grid-template-columns:1fr;}}
  .kpi-chart{height:230px;}
  .kpi-chart canvas{max-height:170px;}
  .muted-note{color:#8a94a6;font-size:12.5px;margin-top:6px;}
</style>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
  requireAuthPage();
  renderLayout('reports', 'Reports', 'Build custom reports for any module, filter by date, and export as PDF, CSV or Excel');
</script>

<template id="tpl">
  <div class="kpi-tabs">
    <button class="btn btn-outline active" id="tabModuleReport" onclick="switchTab('module')">Module Report</button>
    <button class="btn btn-outline" id="tabKpiDashboard" onclick="switchTab('kpi')">Donor &amp; Grant KPI Dashboard</button>
  </div>

  <div id="kpiDashboardSection" class="hidden">
    <div class="card card-pad" style="margin-bottom:18px;">
      <div class="filter-bar">
        <div class="filter-field">
          <label class="label">From Date</label>
          <input class="input" type="date" id="kpi_from">
        </div>
        <div class="filter-field">
          <label class="label">To Date</label>
          <input class="input" type="date" id="kpi_to">
        </div>
        <div class="filter-field">
          <button class="btn btn-primary" onclick="loadKpiDashboard()">Apply</button>
        </div>
        <div class="export-bar">
          <button class="btn btn-outline btn-sm" onclick="exportKpiPDF()">⬇ PDF Summary</button>
        </div>
      </div>
      <div class="muted-note">Donation totals use the "Donation Date" filter above; expenses use the Ledger entry date. Retention compares donors in the trailing 12–24 months to donors in the trailing 0–12 months and is not affected by this filter.</div>
    </div>

    <div style="font-weight:700;font-size:15px;margin:4px 0 10px;">Donors</div>
    <div class="kpi-grid" id="kpiDonorStats"></div>

    <div class="kpi-cols">
      <div class="card card-pad">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px;">Top Donors</div>
        <div class="report-table-wrap">
          <table>
            <thead><tr><th>#</th><th>Donor</th><th>Total Given</th><th>Gifts</th><th>Recurring?</th></tr></thead>
            <tbody id="kpiTopDonorsBody"></tbody>
          </table>
        </div>
      </div>
      <div class="card card-pad kpi-chart">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px;">Donor Retention (YoY)</div>
        <canvas id="kpiRetentionChart"></canvas>
      </div>
    </div>

    <div style="font-weight:700;font-size:15px;margin:4px 0 10px;">Grants</div>
    <div class="kpi-grid" id="kpiGrantStats"></div>

    <div class="kpi-cols">
      <div class="card card-pad kpi-chart">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px;">Grants by Status</div>
        <canvas id="kpiGrantStatusChart"></canvas>
      </div>
      <div class="card card-pad kpi-chart">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px;">Grant Milestone Progress</div>
        <canvas id="kpiMilestoneChart"></canvas>
      </div>
    </div>

    <div style="font-weight:700;font-size:15px;margin:4px 0 10px;">Impact</div>
    <div class="kpi-grid" id="kpiImpactStats"></div>
  </div>

  <div id="moduleReportSection">
  <div class="card card-pad" style="margin-bottom:18px;">
    <div class="filter-bar">
      <div class="filter-field">
        <label class="label">Module</label>
        <select class="select" id="rp_module"></select>
      </div>
      <div class="filter-field">
        <label class="label">From Date</label>
        <input class="input" type="date" id="rp_from">
      </div>
      <div class="filter-field">
        <label class="label">To Date</label>
        <input class="input" type="date" id="rp_to">
      </div>
      <div class="filter-field">
        <label class="label">Status</label>
        <select class="select" id="rp_status">
          <option value="">All</option>
          <option value="New">New</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="filter-field">
        <button class="btn btn-outline" onclick="quickRange(365)">Last 1 Year</button>
      </div>
      <div class="filter-field">
        <button class="btn btn-primary" onclick="runReport()">Apply</button>
      </div>
      <div class="export-bar">
        <button class="btn btn-outline btn-sm" onclick="exportCSV()">⬇ CSV</button>
        <button class="btn btn-outline btn-sm" onclick="exportExcel()">⬇ Excel</button>
        <button class="btn btn-outline btn-sm" onclick="exportPDF()">⬇ PDF</button>
      </div>
    </div>
  </div>

  <div class="report-summary" id="reportSummary"></div>

  <!-- Auto-generated per-field breakdown: every number/decimal/currency field
       gets a "Total" stat card, and every select/multiselect field gets a
       group-by bar chart — all built from whatever fields the module
       currently has, so a brand-new field shows up here with zero extra
       setup the next time this page loads. -->
  <div id="fieldBreakdowns"></div>

  <div class="card card-pad trend-card">
    <div style="font-weight:700;font-size:15px;margin-bottom:10px;">New Records — Last 30 Days</div>
    <canvas id="trendChart"></canvas>
  </div>

  <div class="card">
    <div class="report-table-wrap">
      <table id="reportTable">
        <thead id="reportHead"></thead>
        <tbody id="reportBody"></tbody>
      </table>
    </div>
  </div>
  </div>
</template>

<script>
  document.getElementById('pageContent').innerHTML = document.getElementById('tpl').innerHTML;

  let modules = [];
  let currentReport = null; // { moduleKey, moduleLabel, fields, records }

  async function init() {
    try {
      modules = await api('/modules');
      const sel = document.getElementById('rp_module');
      sel.innerHTML = modules.map(m => `<option value="${esc(m.ModuleKey)}">${esc(m.Label)}</option>`).join('');
      if (modules.length) runReport();
    } catch (e) { toast(e.message, 'error'); }
  }

  function quickRange(days) {
    const to = new Date();
    const from = new Date();
    from.setDate(from.getDate() - days);
    document.getElementById('rp_to').value = to.toISOString().slice(0, 10);
    document.getElementById('rp_from').value = from.toISOString().slice(0, 10);
    runReport();
  }

  function buildQuery() {
    const from = document.getElementById('rp_from').value;
    const to = document.getElementById('rp_to').value;
    const status = document.getElementById('rp_status').value;
    const q = [];
    if (from) q.push('from=' + encodeURIComponent(from));
    if (to) q.push('to=' + encodeURIComponent(to));
    if (status) q.push('status=' + encodeURIComponent(status));
    return q.length ? '?' + q.join('&') : '';
  }

  async function runReport() {
    const moduleKey = document.getElementById('rp_module').value;
    if (!moduleKey) return;
    try {
      currentReport = await api('/reports/' + moduleKey + buildQuery());
      renderSummary();
      renderTable();
      renderFieldBreakdowns();
      renderTrend(moduleKey);
    } catch (e) { toast(e.message, 'error'); }
  }

  let breakdownCharts = [];
  function renderFieldBreakdowns() {
    breakdownCharts.forEach(c => c.destroy());
    breakdownCharts = [];
    const wrap = document.getElementById('fieldBreakdowns');
    const { fields, records } = currentReport;
    const NUMERIC = ['number', 'decimal', 'currency'];
    const CHOICE = ['select', 'multiselect'];

    const numericFields = fields.filter(f => NUMERIC.includes(f.FieldType));
    const choiceFields = fields.filter(f => CHOICE.includes(f.FieldType) && (f.Options || []).length > 0);

    let html = '';
    // Sum / average card per numeric field
    if (numericFields.length) {
      html += `<div class="report-summary" style="margin-bottom:8px;">`;
      numericFields.forEach(f => {
        const vals = records.map(r => Number(r.fields[f.FieldKey])).filter(v => !isNaN(v));
        const sum = vals.reduce((a, b) => a + b, 0);
        const avg = vals.length ? sum / vals.length : 0;
        const shown = f.FieldType === 'currency' ? formatCurrency(sum) : sum.toLocaleString(undefined, { maximumFractionDigits: 2 });
        html += `<div class="stat-card"><div class="stat-num">${shown}</div><div class="stat-label">Total ${esc(f.Label)} (avg ${avg.toLocaleString(undefined,{maximumFractionDigits:1})})</div></div>`;
      });
      html += `</div>`;
    }
    // Group-by bar chart per dropdown field
    choiceFields.forEach((f, idx) => {
      const counts = {};
      records.forEach(r => {
        const v = r.fields[f.FieldKey];
        const list = Array.isArray(v) ? v : (v ? [v] : []);
        if (!list.length) { counts['Unspecified'] = (counts['Unspecified'] || 0) + 1; return; }
        list.forEach(item => { counts[item] = (counts[item] || 0) + 1; });
      });
      html += `<div class="card card-pad" style="height:220px;margin-bottom:18px;">
        <div style="font-weight:700;font-size:15px;margin-bottom:10px;">Breakdown by ${esc(f.Label)}</div>
        <canvas id="brkChart${idx}" style="max-height:160px;"></canvas>
      </div>`;
    });

    wrap.innerHTML = html;

    choiceFields.forEach((f, idx) => {
      const counts = {};
      records.forEach(r => {
        const v = r.fields[f.FieldKey];
        const list = Array.isArray(v) ? v : (v ? [v] : []);
        if (!list.length) { counts['Unspecified'] = (counts['Unspecified'] || 0) + 1; return; }
        list.forEach(item => { counts[item] = (counts[item] || 0) + 1; });
      });
      const chart = new Chart(document.getElementById('brkChart' + idx), {
        type: 'bar',
        data: {
          labels: Object.keys(counts),
          datasets: [{ label: f.Label, data: Object.values(counts), backgroundColor: '#1B63C4' }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      });
      breakdownCharts.push(chart);
    });
  }

  let trendChartInstance = null;
  async function renderTrend(moduleKey) {
    try {
      const series = await api('/reports/timeseries?moduleKey=' + encodeURIComponent(moduleKey) + '&days=30');
      const labels = series.map(p => new Date(p.day).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
      const data = series.map(p => p.total);
      if (trendChartInstance) trendChartInstance.destroy();
      trendChartInstance = new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: { labels, datasets: [{ label: 'New records', data, borderColor: '#1B63C4', backgroundColor: 'rgba(27,99,196,.12)', fill: true, tension: 0.3, pointRadius: 2 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      });
    } catch (e) { /* non-critical widget */ }
  }

  function renderSummary() {
    const { records } = currentReport;
    const total = records.length;
    const counts = {};
    records.forEach(r => { const s = r.status || 'Unspecified'; counts[s] = (counts[s] || 0) + 1; });
    let html = `<div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total Records</div></div>`;
    Object.entries(counts).forEach(([status, count]) => {
      html += `<div class="stat-card"><div class="stat-num">${count}</div><div class="stat-label">${esc(status)}</div></div>`;
    });
    document.getElementById('reportSummary').innerHTML = html;
  }

  // The report table is fully dynamic — its columns always mirror whatever
  // fields the selected module currently has (including brand-new custom
  // fields added from Modules & Fields), so nothing here needs code changes
  // when a module's schema changes.
  function reportColumns() {
    return currentReport.fields.slice().sort((a, b) => a.SortOrder - b.SortOrder);
  }

  function renderTable() {
    const cols = reportColumns();
    document.getElementById('reportHead').innerHTML = `
      <tr>
        <th>#</th>
        ${cols.map(f => `<th>${esc(f.Label)}</th>`).join('')}
        <th>Status</th><th>Owner</th><th>Created</th>
      </tr>
    `;
    const body = document.getElementById('reportBody');
    if (currentReport.records.length === 0) {
      body.innerHTML = `<tr><td colspan="${cols.length + 4}" class="empty">No records match these filters</td></tr>`;
      return;
    }
    body.innerHTML = currentReport.records.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        ${cols.map(f => `<td>${esc(formatVal(r.fields[f.FieldKey], f.FieldType))}</td>`).join('')}
        <td>${r.status ? `<span class="badge badge-blue">${esc(r.status)}</span>` : '—'}</td>
        <td>${esc(r.ownerName) || '—'}</td>
        <td>${new Date(r.createdAt).toLocaleDateString()}</td>
      </tr>
    `).join('');
  }

  function formatVal(v, type) {
    if (v === undefined || v === null || v === '') return '—';
    if (Array.isArray(v)) return v.length ? v.join(', ') : '—';
    if (type === 'checkbox') return v ? 'Yes' : 'No';
    if (type === 'currency') return formatCurrency(v);
    return v;
  }

  function reportRowsForExport() {
    const cols = reportColumns();
    const header = ['#', ...cols.map(f => f.Label), 'Status', 'Owner', 'Created'];
    const rows = currentReport.records.map((r, i) => [
      i + 1,
      ...cols.map(f => formatVal(r.fields[f.FieldKey], f.FieldType)),
      r.status || '',
      r.ownerName || '',
      new Date(r.createdAt).toLocaleDateString()
    ]);
    return { header, rows };
  }

  function exportFilename(ext) {
    const from = document.getElementById('rp_from').value || 'all';
    const to = document.getElementById('rp_to').value || 'all';
    return `${currentReport.moduleKey}-report_${from}_to_${to}.${ext}`;
  }

  function exportCSV() {
    if (!currentReport) return;
    const { header, rows } = reportRowsForExport();
    const escCsv = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const csv = [header.map(escCsv).join(','), ...rows.map(r => r.map(escCsv).join(','))].join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    downloadBlob(blob, exportFilename('csv'));
  }

  function exportExcel() {
    if (!currentReport) return;
    const { header, rows } = reportRowsForExport();
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, currentReport.moduleLabel.slice(0, 28) || 'Report');
    XLSX.writeFile(wb, exportFilename('xlsx'));
  }

  function exportPDF() {
    if (!currentReport) return;
    const { header, rows } = reportRowsForExport();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: header.length > 6 ? 'landscape' : 'portrait' });
    doc.setFontSize(14);
    doc.text(`${currentReport.moduleLabel} Report`, 14, 16);
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text(`Generated ${new Date().toLocaleString()}`, 14, 22);
    doc.autoTable({ head: [header], body: rows, startY: 27, styles: { fontSize: 8 }, headStyles: { fillColor: [27, 99, 196] } });
    doc.save(exportFilename('pdf'));
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  document.addEventListener('change', (e) => {
    if (e.target.id === 'rp_module') runReport();
  });

  // ===== Donor & Grant KPI Dashboard =====
  let kpiData = null;
  let kpiCharts = { retention: null, grantStatus: null, milestone: null };

  function switchTab(tab) {
    const kpiSection = document.getElementById('kpiDashboardSection');
    const moduleSection = document.getElementById('moduleReportSection');
    document.getElementById('tabModuleReport').classList.toggle('active', tab === 'module');
    document.getElementById('tabKpiDashboard').classList.toggle('active', tab === 'kpi');
    kpiSection.classList.toggle('hidden', tab !== 'kpi');
    moduleSection.classList.toggle('hidden', tab === 'kpi');
    if (tab === 'kpi' && !kpiData) loadKpiDashboard();
  }

  function kpiQuery() {
    const from = document.getElementById('kpi_from').value;
    const to = document.getElementById('kpi_to').value;
    const q = [];
    if (from) q.push('from=' + encodeURIComponent(from));
    if (to) q.push('to=' + encodeURIComponent(to));
    return q.length ? '?' + q.join('&') : '';
  }

  function pct(v) { return v === null || v === undefined ? '—' : v.toFixed(1) + '%'; }

  async function loadKpiDashboard() {
    try {
      kpiData = await api('/reports/donor-grant-kpis' + kpiQuery());
      renderKpiDonorStats();
      renderKpiTopDonors();
      renderKpiRetentionChart();
      renderKpiGrantStats();
      renderKpiGrantStatusChart();
      renderKpiMilestoneChart();
      renderKpiImpactStats();
    } catch (e) { toast(e.message, 'error'); }
  }

  function renderKpiDonorStats() {
    const d = kpiData.donors;
    document.getElementById('kpiDonorStats').innerHTML = `
      <div class="stat-card"><div class="stat-num">${formatCurrency(d.totalDonationAmount)}</div><div class="stat-label">Total Donated (in range)</div></div>
      <div class="stat-card"><div class="stat-num">${d.uniqueDonorCount}</div><div class="stat-label">Unique Donors</div></div>
      <div class="stat-card"><div class="stat-num">${formatCurrency(d.avgDonationSize)}</div><div class="stat-label">Average Gift Size</div></div>
      <div class="stat-card"><div class="stat-num">${pct(d.recurringDonorSharePct)}</div><div class="stat-label">Recurring Donors (${d.recurringDonorCount})</div></div>
      <div class="stat-card"><div class="stat-num">${pct(d.retentionRatePct)}</div><div class="stat-label">Donor Retention (YoY)</div></div>
    `;
  }

  function renderKpiTopDonors() {
    const list = kpiData.donors.topDonors;
    const body = document.getElementById('kpiTopDonorsBody');
    if (!list.length) { body.innerHTML = `<tr><td colspan="5" class="empty">No donations in this range</td></tr>`; return; }
    body.innerHTML = list.map((donor, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${esc(donor.name)}</td>
        <td>${formatCurrency(donor.amount)}</td>
        <td>${donor.count}</td>
        <td>${donor.recurring ? '<span class="badge badge-blue">Yes</span>' : '—'}</td>
      </tr>
    `).join('');
  }

  function renderKpiRetentionChart() {
    const w = kpiData.donors.retentionWindow;
    if (kpiCharts.retention) kpiCharts.retention.destroy();
    kpiCharts.retention = new Chart(document.getElementById('kpiRetentionChart'), {
      type: 'bar',
      data: {
        labels: ['Donors (prior 12mo)', 'Retained into current 12mo'],
        datasets: [{ data: [w.prevDonorCount, w.retainedCount], backgroundColor: ['#94a3b8', '#1B63C4'] }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    });
  }

  function renderKpiGrantStats() {
    const g = kpiData.grants;
    document.getElementById('kpiGrantStats').innerHTML = `
      <div class="stat-card"><div class="stat-num">${g.totalGrants}</div><div class="stat-label">Total Grants</div></div>
      <div class="stat-card"><div class="stat-num">${formatCurrency(g.totalGrantAmount)}</div><div class="stat-label">Total Grant Value</div></div>
      <div class="stat-card"><div class="stat-num">${formatCurrency(g.activeGrantAmount)}</div><div class="stat-label">Active Grant Value</div></div>
      <div class="stat-card"><div class="stat-num">${pct(g.milestoneCompletionRatePct)}</div><div class="stat-label">Milestones Completed (${g.milestones.completed}/${g.milestones.total})</div></div>
      <div class="stat-card"><div class="stat-num">${g.milestones.overdue}</div><div class="stat-label">Overdue Milestones</div></div>
    `;
  }

  function renderKpiGrantStatusChart() {
    const counts = kpiData.grants.statusBreakdown;
    if (kpiCharts.grantStatus) kpiCharts.grantStatus.destroy();
    kpiCharts.grantStatus = new Chart(document.getElementById('kpiGrantStatusChart'), {
      type: 'bar',
      data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: '#1B63C4' }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    });
  }

  function renderKpiMilestoneChart() {
    const m = kpiData.grants.milestones;
    const pending = Math.max(m.total - m.completed - m.overdue, 0);
    if (kpiCharts.milestone) kpiCharts.milestone.destroy();
    kpiCharts.milestone = new Chart(document.getElementById('kpiMilestoneChart'), {
      type: 'doughnut',
      data: {
        labels: ['Completed', 'Overdue', 'On track / upcoming'],
        datasets: [{ data: [m.completed, m.overdue, pending], backgroundColor: ['#16a34a', '#dc2626', '#94a3b8'] }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  function renderKpiImpactStats() {
    const im = kpiData.impact;
    document.getElementById('kpiImpactStats').innerHTML = `
      <div class="stat-card"><div class="stat-num">${im.beneficiaryCount}</div><div class="stat-label">Beneficiaries on File</div></div>
      <div class="stat-card"><div class="stat-num">${formatCurrency(im.totalExpense)}</div><div class="stat-label">Total Expense (Ledger, in range)</div></div>
      <div class="stat-card"><div class="stat-num">${im.costPerBeneficiary === null ? '—' : formatCurrency(im.costPerBeneficiary)}</div><div class="stat-label">Cost per Beneficiary</div></div>
    `;
  }

  function exportKpiPDF() {
    if (!kpiData) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const d = kpiData.donors, g = kpiData.grants, im = kpiData.impact;
    doc.setFontSize(14);
    doc.text('Donor & Grant KPI Summary', 14, 16);
    doc.setFontSize(9); doc.setTextColor(120);
    doc.text(`Generated ${new Date().toLocaleString()}`, 14, 22);
    doc.autoTable({
      startY: 27,
      head: [['Donor Metric', 'Value']],
      body: [
        ['Total Donated', formatCurrency(d.totalDonationAmount)],
        ['Unique Donors', d.uniqueDonorCount],
        ['Average Gift Size', formatCurrency(d.avgDonationSize)],
        ['Recurring Donors', `${d.recurringDonorCount} (${pct(d.recurringDonorSharePct)})`],
        ['Donor Retention (YoY)', pct(d.retentionRatePct)]
      ],
      styles: { fontSize: 9 }, headStyles: { fillColor: [27, 99, 196] }
    });
    doc.autoTable({
      head: [['Grant Metric', 'Value']],
      body: [
        ['Total Grants', g.totalGrants],
        ['Total Grant Value', formatCurrency(g.totalGrantAmount)],
        ['Active Grant Value', formatCurrency(g.activeGrantAmount)],
        ['Milestones Completed', `${g.milestones.completed}/${g.milestones.total} (${pct(g.milestoneCompletionRatePct)})`],
        ['Overdue Milestones', g.milestones.overdue]
      ],
      styles: { fontSize: 9 }, headStyles: { fillColor: [27, 99, 196] }
    });
    doc.autoTable({
      head: [['Impact Metric', 'Value']],
      body: [
        ['Beneficiaries on File', im.beneficiaryCount],
        ['Total Expense', formatCurrency(im.totalExpense)],
        ['Cost per Beneficiary', im.costPerBeneficiary === null ? '—' : formatCurrency(im.costPerBeneficiary)]
      ],
      styles: { fontSize: 9 }, headStyles: { fillColor: [27, 99, 196] }
    });
    doc.autoTable({
      head: [['#', 'Top Donor', 'Total Given', 'Gifts']],
      body: d.topDonors.map((don, i) => [i + 1, don.name, formatCurrency(don.amount), don.count]),
      styles: { fontSize: 9 }, headStyles: { fillColor: [27, 99, 196] }
    });
    doc.save(`donor-grant-kpi-summary_${new Date().toISOString().slice(0, 10)}.pdf`);
  }

  init();
</script>
</body>
</html>
