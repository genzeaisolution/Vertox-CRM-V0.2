<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roles & Permissions — Vertox CRM</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
  requireAuthPage();
  renderLayout('roles', 'Roles & Permissions', 'Create roles and control what each role can access');
</script>

<template id="tpl">
  <div class="toolbar">
    <div></div>
    <button class="btn btn-primary" onclick="openRoleModal()">+ New Role</button>
  </div>
  <div id="rolesGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;"></div>
</template>

<div class="modal-overlay hidden" id="roleModalOverlay">
  <div class="modal" style="width:520px;">
    <div class="modal-head">
      <div class="modal-title" id="roleModalTitle">New Role</div>
      <button class="close-x" onclick="closeRoleModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editRoleId">
      <div class="field"><label class="label">Role Name</label><input class="input" id="r_name"></div>
      <div class="field"><label class="label">Description</label><input class="input" id="r_desc"></div>
      <div class="field">
        <label class="label">Permissions</label>
        <div id="permList" style="max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:10px;"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeRoleModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveRole()">Save Role</button>
    </div>
  </div>
</div>

<script>
  document.getElementById('pageContent').innerHTML = document.getElementById('tpl').innerHTML;
  let allRoles = [], allPerms = [];

  async function load() {
    try {
      [allRoles, allPerms] = await Promise.all([api('/roles'), api('/roles/permissions/all')]);
      renderRoles();
    } catch (e) { toast(e.message, 'error'); }
  }

  function renderRoles() {
    const grid = document.getElementById('rolesGrid');
    grid.innerHTML = allRoles.map(r => `
      <div class="card card-pad">
        <div style="display:flex;justify-content:space-between;align-items:start;">
          <div>
            <div style="font-weight:700;font-size:15px;">${esc(r.RoleName)} ${r.IsSystem ? '<span class="tag">system</span>' : ''}</div>
            <div style="font-size:12.5px;color:var(--ink-soft);margin-top:3px;">${esc(r.Description) || 'No description'}</div>
          </div>
        </div>
        <div style="margin:12px 0;font-size:12px;color:var(--ink-soft);">${r.permissions.length} permission(s) granted</div>
        <div style="display:flex;gap:8px;">
          ${!r.IsSystem ? `<button class="btn btn-outline btn-sm" onclick='editRole(${r.RoleId})'>Edit</button>` : ''}
          ${!r.IsSystem ? `<button class="btn btn-danger btn-sm" onclick="deleteRole(${r.RoleId})">Delete</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  function buildPermList(checkedKeys = []) {
    const groups = {};
    allPerms.forEach(p => { (groups[p.Module] = groups[p.Module] || []).push(p); });
    document.getElementById('permList').innerHTML = Object.entries(groups).map(([mod, perms]) => `
      <div style="margin-bottom:10px;">
        <div style="font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;">${esc(mod)}</div>
        ${perms.map(p => `
          <label class="checkbox-row" style="margin-bottom:6px;">
            <input type="checkbox" value="${esc(p.PermKey)}" ${checkedKeys.includes(p.PermKey)?'checked':''}>
            <span style="font-size:13px;">${esc(p.Description) || esc(p.PermKey)}</span>
          </label>
        `).join('')}
      </div>
    `).join('');
  }

  function openRoleModal() {
    clearFieldErrors('roleModalOverlay');
    document.getElementById('roleModalTitle').textContent = 'New Role';
    document.getElementById('editRoleId').value = '';
    document.getElementById('r_name').value = '';
    document.getElementById('r_desc').value = '';
    buildPermList([]);
    document.getElementById('roleModalOverlay').classList.remove('hidden');
  }
  function closeRoleModal() { document.getElementById('roleModalOverlay').classList.add('hidden'); }

  function editRole(id) {
    clearFieldErrors('roleModalOverlay');
    const r = allRoles.find(x => x.RoleId === id);
    document.getElementById('roleModalTitle').textContent = 'Edit Role';
    document.getElementById('editRoleId').value = id;
    document.getElementById('r_name').value = r.RoleName;
    document.getElementById('r_desc').value = r.Description || '';
    buildPermList(r.permissions);
    document.getElementById('roleModalOverlay').classList.remove('hidden');
  }

  async function saveRole() {
    const id = document.getElementById('editRoleId').value;
    const permissionKeys = Array.from(document.querySelectorAll('#permList input[type=checkbox]:checked')).map(c => c.value);
    const payload = {
      roleName: document.getElementById('r_name').value.trim(),
      description: document.getElementById('r_desc').value.trim(),
      permissionKeys
    };
    try {
      if (id) { await api('/roles/' + id, { method: 'PUT', body: payload }); toast('Role updated', 'success'); }
      else { await api('/roles', { method: 'POST', body: payload }); toast('Role created', 'success'); }
      closeRoleModal(); load();
    } catch (e) { showFieldErrors('roleModalOverlay', ROLE_FIELD_MAP, e); }
  }

  const ROLE_FIELD_MAP = { roleName: 'r_name', description: 'r_desc' };

  async function deleteRole(id) {
    if (!confirm('Delete this role?')) return;
    try { await api('/roles/' + id, { method: 'DELETE' }); toast('Role deleted', 'success'); load(); }
    catch (e) { toast(e.message, 'error'); }
  }

  load();
</script>
</body>
</html>
