<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modules & Fields — Vertox CRM</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
  requireAuthPage();
  renderLayout('modules', 'Modules & Fields', 'Fully dynamic — add modules and custom fields without any code change');
</script>

<template id="tpl">
  <div class="toolbar">
    <div></div>
    <button class="btn btn-primary" onclick="openModuleModal()">+ New Module</button>
  </div>
  <div id="modulesList"></div>
</template>

<!-- New Module Modal -->
<div class="modal-overlay hidden" id="moduleModalOverlay">
  <div class="modal">
    <div class="modal-head"><div class="modal-title">New Module</div><button class="close-x" onclick="closeModuleModal()">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label class="label">Module Key (no spaces, e.g. projects)</label><input class="input" id="m_key"></div>
      <div class="field"><label class="label">Display Label</label><input class="input" id="m_label"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModuleModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveModule()">Create Module</button>
    </div>
  </div>
</div>

<!-- New/Edit Field Modal -->
<div class="modal-overlay hidden" id="fieldModalOverlay">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="fieldModalTitle">Add Field</div><button class="close-x" onclick="closeFieldModal()">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="fld_moduleId"><input type="hidden" id="fld_fieldId">
      <div class="field"><label class="label">Field Key (machine name, e.g. budget)</label><input class="input" id="fld_key"></div>
      <div class="field"><label class="label">Label</label><input class="input" id="fld_label"></div>
      <div class="field">
        <label class="label">Field Type</label>
        <select class="select" id="fld_type" onchange="toggleTypeFields()">
          <option value="text">Text (short)</option>
          <option value="textarea">Textarea (long text)</option>
          <option value="number">Number (whole)</option>
          <option value="decimal">Decimal (e.g. 12.5)</option>
          <option value="currency">Currency</option>
          <option value="email">Email</option>
          <option value="phone">Phone</option>
          <option value="url">Link / URL</option>
          <option value="date">Date</option>
          <option value="datetime">Date &amp; Time</option>
          <option value="select">Dropdown (single choice)</option>
          <option value="multiselect">Multi-select (many choices)</option>
          <option value="checkbox">Checkbox (yes/no)</option>
          <option value="reference">Link to another module's records</option>
          <option value="user_select">Assign to a staff member</option>
        </select>
      </div>
      <div class="field hidden" id="optionsWrap">
        <label class="label">Options (comma separated)</label>
        <input class="input" id="fld_options" placeholder="Option A, Option B, Option C">
      </div>
      <div class="field hidden" id="refModuleWrap">
        <label class="label">Which module does this link to?</label>
        <select class="select" id="fld_refmodule"></select>
      </div>
      <label class="checkbox-row" style="margin-bottom:12px;"><input type="checkbox" id="fld_required"> <span>Required field</span></label>
      <label class="checkbox-row" style="margin-bottom:12px;"><input type="checkbox" id="fld_showInList" checked> <span>Show in list view (as a column)</span></label>

      <!-- Advanced / optional settings — collapsed by default so the basic
           flow (key, label, type) stays fast for the common case, but every
           field type has real extra controls, not just decoration. -->
      <div style="margin-top:6px;">
        <button type="button" class="btn btn-outline btn-sm" onclick="toggleAdvanced()" id="advToggleBtn">+ Advanced / Optional settings</button>
      </div>
      <div class="hidden" id="advancedWrap" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border, #e6eaf0);">
        <div class="field"><label class="label">Placeholder text</label><input class="input" id="fld_placeholder" placeholder="Shown inside the empty input"></div>
        <div class="field"><label class="label">Help text (shown under the field)</label><input class="input" id="fld_helptext" placeholder="e.g. Enter amount in USD"></div>
        <div class="field"><label class="label">Default value (used when a new record is created)</label><input class="input" id="fld_default"></div>

        <div class="field hidden" id="numRangeWrap" style="display:flex;gap:10px;">
          <div style="flex:1;"><label class="label">Minimum value</label><input class="input" type="number" id="fld_min"></div>
          <div style="flex:1;"><label class="label">Maximum value</label><input class="input" type="number" id="fld_max"></div>
        </div>
        <div class="field hidden" id="decimalsWrap"><label class="label">Decimal places</label><input class="input" type="number" min="0" max="6" id="fld_decimals" placeholder="e.g. 2"></div>
        <div class="field hidden" id="prefixSuffixWrap" style="display:flex;gap:10px;">
          <div style="flex:1;"><label class="label">Prefix (shown before value)</label><input class="input" id="fld_prefix" placeholder="e.g. Rs. / $"></div>
          <div style="flex:1;"><label class="label">Suffix (shown after value)</label><input class="input" id="fld_suffix" placeholder="e.g. kg / %"></div>
        </div>
        <div class="field hidden" id="maxLenWrap"><label class="label">Maximum characters allowed</label><input class="input" type="number" id="fld_maxlength" placeholder="e.g. 250"></div>

        <label class="checkbox-row"><input type="checkbox" id="fld_unique"> <span>Must be unique (no two records can have the same value)</span></label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeFieldModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveField()">Save Field</button>
    </div>
  </div>
</div>

<script>
  document.getElementById('pageContent').innerHTML = document.getElementById('tpl').innerHTML;
  let modules = [];

  async function load() {
    try {
      modules = await api('/modules');
      renderModules();
    } catch (e) { toast(e.message, 'error'); }
  }

  function renderModules() {
    const wrap = document.getElementById('modulesList');
    wrap.innerHTML = modules.map(m => `
      <div class="card card-pad" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
          <div>
            <div style="font-weight:700;font-size:15px;">${esc(m.Label)} ${m.IsSystem?'<span class="tag">system</span>':''}</div>
            <div style="font-size:12px;color:var(--ink-soft);">key: ${esc(m.ModuleKey)}</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-outline btn-sm" onclick='openFieldModal(${m.ModuleId})'>+ Add Field</button>
            ${!m.IsSystem ? `<button class="btn btn-danger btn-sm" onclick="deleteModule(${m.ModuleId})">Delete Module</button>` : ''}
          </div>
        </div>
        ${m.fields.map(f => `
          <div class="field-row">
            <div class="grow">
              <strong>${esc(f.Label)}</strong> <span class="tag">${esc(f.FieldType)}</span> ${f.IsRequired ? '<span class="tag" style="background:#FDEDED;color:var(--danger);">required</span>' : ''} ${f.Config && f.Config.unique ? '<span class="tag">unique</span>' : ''}
              <div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px;">key: ${esc(f.FieldKey)}${configSummary(f.Config)}</div>
            </div>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-outline btn-sm" onclick='openFieldModal(${m.ModuleId}, ${f.FieldId})'>Edit</button>
              ${!f.IsDefault ? `<button class="btn btn-outline btn-sm" onclick='deleteField(${f.FieldId})'>Remove</button>` : `<span class="tag">core</span>`}
            </div>
          </div>
        `).join('') || `<div class="empty" style="padding:20px;">No custom fields yet</div>`}
      </div>
    `).join('');
  }

  function configSummary(cfg) {
    if (!cfg) return '';
    const parts = [];
    if (cfg.min !== undefined || cfg.max !== undefined) parts.push(`range: ${cfg.min ?? '-∞'}–${cfg.max ?? '∞'}`);
    if (cfg.decimals !== undefined) parts.push(`${cfg.decimals} decimals`);
    if (cfg.defaultValue) parts.push(`default: ${cfg.defaultValue}`);
    return parts.length ? '  •  ' + esc(parts.join('  •  ')) : '';
  }

  function openModuleModal(){ clearFieldErrors('moduleModalOverlay'); document.getElementById('m_key').value=''; document.getElementById('m_label').value=''; document.getElementById('moduleModalOverlay').classList.remove('hidden'); }
  function closeModuleModal(){ document.getElementById('moduleModalOverlay').classList.add('hidden'); }

  async function saveModule() {
    try {
      const key = document.getElementById('m_key').value.trim().toLowerCase().replace(/\s+/g,'_');
      const label = document.getElementById('m_label').value.trim();
      await api('/modules', { method: 'POST', body: { moduleKey: key, label } });
      toast('Module created', 'success');
      closeModuleModal(); load();
    } catch (e) { showFieldErrors('moduleModalOverlay', { moduleKey: 'm_key', label: 'm_label' }, e); }
  }

  async function deleteModule(id) {
    if (!confirm('Delete this module and ALL its records?')) return;
    try { await api('/modules/' + id, { method: 'DELETE' }); toast('Module deleted', 'success'); load(); }
    catch (e) { toast(e.message, 'error'); }
  }

  // Which advanced controls make sense for each field type — this is what
  // makes "Advanced settings" mean something different (and correct) per
  // type instead of showing every option for every field.
  const TYPE_CAPS = {
    text:        { options:false, range:false, decimals:false, prefixSuffix:false, maxLen:true  },
    textarea:    { options:false, range:false, decimals:false, prefixSuffix:false, maxLen:true  },
    number:      { options:false, range:true,  decimals:false, prefixSuffix:true,  maxLen:false },
    decimal:     { options:false, range:true,  decimals:true,  prefixSuffix:true,  maxLen:false },
    currency:    { options:false, range:true,  decimals:true,  prefixSuffix:true,  maxLen:false },
    email:       { options:false, range:false, decimals:false, prefixSuffix:false, maxLen:false },
    phone:       { options:false, range:false, decimals:false, prefixSuffix:false, maxLen:false },
    url:         { options:false, range:false, decimals:false, prefixSuffix:false, maxLen:false },
    date:        { options:false, range:false, decimals:false, prefixSuffix:false, maxLen:false },
    datetime:    { options:false, range:false, decimals:false, prefixSuffix:false, maxLen:false },
    select:      { options:true,  range:false, decimals:false, prefixSuffix:false, maxLen:false },
    multiselect: { options:true,  range:false, decimals:false, prefixSuffix:false, maxLen:false },
    checkbox:    { options:false, range:false, decimals:false, prefixSuffix:false, maxLen:false },
    reference:   { options:false, range:false, decimals:false, prefixSuffix:false, maxLen:false, refModule:true },
    user_select: { options:false, range:false, decimals:false, prefixSuffix:false, maxLen:false }
  };

  function toggleTypeFields() {
    const type = document.getElementById('fld_type').value;
    const caps = TYPE_CAPS[type] || {};
    document.getElementById('optionsWrap').classList.toggle('hidden', !caps.options);
    document.getElementById('numRangeWrap').classList.toggle('hidden', !caps.range);
    document.getElementById('decimalsWrap').classList.toggle('hidden', !caps.decimals);
    document.getElementById('prefixSuffixWrap').classList.toggle('hidden', !caps.prefixSuffix);
    document.getElementById('maxLenWrap').classList.toggle('hidden', !caps.maxLen);
    document.getElementById('refModuleWrap').classList.toggle('hidden', !caps.refModule);
    if (caps.refModule) populateRefModuleSelect();
  }

  // Fills the "which module does this link to?" dropdown with every module
  // except the one currently being edited (a field can't reference its own module).
  function populateRefModuleSelect() {
    const sel = document.getElementById('fld_refmodule');
    const currentModuleId = Number(document.getElementById('fld_moduleId').value);
    const keepValue = sel.dataset.pendingValue || sel.value;
    sel.innerHTML = modules
      .filter(m => m.ModuleId !== currentModuleId)
      .map(m => `<option value="${esc(m.ModuleKey)}">${esc(m.Label)}</option>`)
      .join('');
    if (keepValue) sel.value = keepValue;
    delete sel.dataset.pendingValue;
  }

  function toggleAdvanced() {
    const wrap = document.getElementById('advancedWrap');
    const open = wrap.classList.toggle('hidden') === false;
    document.getElementById('advToggleBtn').textContent = open ? '- Hide advanced / optional settings' : '+ Advanced / Optional settings';
  }

  function openFieldModal(moduleId, fieldId) {
    clearFieldErrors('fieldModalOverlay');
    const mod = modules.find(m => m.ModuleId === moduleId);
    const field = fieldId ? mod?.fields.find(f => f.FieldId === fieldId) : null;
    const cfg = (field && field.Config) || {};

    document.getElementById('fieldModalTitle').textContent = field ? 'Edit Field' : 'Add Field';
    document.getElementById('fld_moduleId').value = moduleId;
    document.getElementById('fld_fieldId').value = field ? field.FieldId : '';
    document.getElementById('fld_key').value = field ? field.FieldKey : '';
    document.getElementById('fld_key').disabled = !!field;
    document.getElementById('fld_label').value = field ? field.Label : '';
    document.getElementById('fld_type').value = field ? field.FieldType : 'text';
    document.getElementById('fld_options').value = field && field.Options ? field.Options.join(', ') : '';
    document.getElementById('fld_required').checked = field ? !!field.IsRequired : false;
    document.getElementById('fld_showInList').checked = field ? !!field.ShowInList : true;

    document.getElementById('fld_placeholder').value = cfg.placeholder || '';
    document.getElementById('fld_helptext').value = cfg.helpText || '';
    document.getElementById('fld_default').value = cfg.defaultValue || '';
    document.getElementById('fld_min').value = cfg.min ?? '';
    document.getElementById('fld_max').value = cfg.max ?? '';
    document.getElementById('fld_decimals').value = cfg.decimals ?? '';
    document.getElementById('fld_prefix').value = cfg.prefix || '';
    document.getElementById('fld_suffix').value = cfg.suffix || '';
    document.getElementById('fld_maxlength').value = cfg.maxLength ?? '';
    document.getElementById('fld_unique').checked = !!cfg.unique;
    // populateRefModuleSelect() runs inside toggleTypeFields() below and wipes
    // the select's options — stash the value to restore here first, since
    // this field's own <option> may not exist in the freshly-built list yet.
    document.getElementById('fld_refmodule').dataset.pendingValue = cfg.refModule || '';

    // Collapse advanced panel by default; auto-open it if this field already has advanced settings, so editing shows what's actually configured.
    const hasAdv = Object.keys(cfg).length > 0;
    document.getElementById('advancedWrap').classList.toggle('hidden', !hasAdv);
    document.getElementById('advToggleBtn').textContent = hasAdv ? '- Hide advanced / optional settings' : '+ Advanced / Optional settings';

    toggleTypeFields();
    document.getElementById('fieldModalOverlay').classList.remove('hidden');
  }
  function closeFieldModal(){ document.getElementById('fieldModalOverlay').classList.add('hidden'); }

  function buildConfig(type) {
    const caps = TYPE_CAPS[type] || {};
    const cfg = {};
    const ph = document.getElementById('fld_placeholder').value.trim(); if (ph) cfg.placeholder = ph;
    const help = document.getElementById('fld_helptext').value.trim(); if (help) cfg.helpText = help;
    const def = document.getElementById('fld_default').value.trim(); if (def) cfg.defaultValue = def;
    if (caps.range) {
      const min = document.getElementById('fld_min').value; if (min !== '') cfg.min = Number(min);
      const max = document.getElementById('fld_max').value; if (max !== '') cfg.max = Number(max);
    }
    if (caps.decimals) {
      const dec = document.getElementById('fld_decimals').value; if (dec !== '') cfg.decimals = Number(dec);
    }
    if (caps.prefixSuffix) {
      const pre = document.getElementById('fld_prefix').value.trim(); if (pre) cfg.prefix = pre;
      const suf = document.getElementById('fld_suffix').value.trim(); if (suf) cfg.suffix = suf;
    }
    if (caps.maxLen) {
      const ml = document.getElementById('fld_maxlength').value; if (ml !== '') cfg.maxLength = Number(ml);
    }
    if (document.getElementById('fld_unique').checked) cfg.unique = true;
    if (caps.refModule) {
      const rm = document.getElementById('fld_refmodule').value;
      if (rm) cfg.refModule = rm;
    }
    return cfg;
  }

  async function saveField() {
    try {
      const moduleId = document.getElementById('fld_moduleId').value;
      const fieldId = document.getElementById('fld_fieldId').value;
      const type = document.getElementById('fld_type').value;
      const options = (TYPE_CAPS[type] || {}).options
        ? document.getElementById('fld_options').value.split(',').map(s => s.trim()).filter(Boolean)
        : null;
      const payload = {
        fieldKey: document.getElementById('fld_key').value.trim().toLowerCase().replace(/\s+/g,'_'),
        label: document.getElementById('fld_label').value.trim(),
        fieldType: type,
        options,
        config: buildConfig(type),
        isRequired: document.getElementById('fld_required').checked,
        showInList: document.getElementById('fld_showInList').checked
      };
      if (fieldId) {
        // Preserve the field's existing display order — the update endpoint
        // resets SortOrder to 0 when it isn't supplied, which would otherwise
        // silently reshuffle every field's position on a simple edit.
        const mod = modules.find(m => m.ModuleId == moduleId);
        const existing = mod?.fields.find(f => f.FieldId == fieldId);
        payload.sortOrder = existing ? existing.SortOrder : 0;
        await api('/modules/fields/' + fieldId, { method: 'PUT', body: payload });
        toast('Field updated', 'success');
      } else {
        await api('/modules/' + moduleId + '/fields', { method: 'POST', body: payload });
        toast('Field added', 'success');
      }
      closeFieldModal(); load();
    } catch (e) { showFieldErrors('fieldModalOverlay', { fieldKey: 'fld_key', label: 'fld_label', fieldType: 'fld_type', config: 'fld_min' }, e); }
  }

  async function deleteField(fieldId) {
    if (!confirm('Remove this field? Existing data for it will remain but hidden.')) return;
    try { await api('/modules/fields/' + fieldId, { method: 'DELETE' }); toast('Field removed', 'success'); load(); }
    catch (e) { toast(e.message, 'error'); }
  }

  load();
</script>
</body>
</html>
