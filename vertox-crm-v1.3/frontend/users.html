<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — Vertox CRM</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
  requireAuthPage();
  renderLayout('users', 'Users', 'Create users and assign roles');
</script>

<template id="tpl">
  <div class="toolbar">
    <div class="search-box"><input class="input" id="searchBox" placeholder="Search users..."></div>
    <button class="btn btn-primary" onclick="openUserModal()">+ New User</button>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th></th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
</template>

<div class="modal-overlay hidden" id="userModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">New User</div>
      <button class="close-x" onclick="closeUserModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editUserId">
      <div class="field"><label class="label">Username</label><input class="input" id="f_username"></div>
      <div class="field"><label class="label">Full Name</label><input class="input" id="f_fullName"></div>
      <div class="field"><label class="label">Email</label><input class="input" id="f_email" type="email"></div>
      <div class="field"><label class="label">Password <span id="pwHint" style="color:var(--ink-faint);font-weight:400;"></span></label><input class="input" id="f_password" type="password"></div>
      <div class="field"><label class="label">Role</label><select class="select" id="f_role"></select></div>
      <div class="field"><label class="label">Status</label>
        <select class="select" id="f_status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
          <option value="suspended">Suspended</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeUserModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveUser()">Save User</button>
    </div>
  </div>
</div>

<script>
  document.getElementById('pageContent').innerHTML = document.getElementById('tpl').innerHTML;
  let allUsers = [], allRoles = [];

  async function load() {
    try {
      [allUsers, allRoles] = await Promise.all([api('/users'), api('/roles')]);
      renderUsers(allUsers);
      document.getElementById('f_role').innerHTML = allRoles.map(r => `<option value="${r.RoleId}">${r.RoleName}</option>`).join('');
    } catch (e) { toast(e.message, 'error'); }
  }

  function renderUsers(list) {
    const body = document.getElementById('usersBody');
    if (list.length === 0) { body.innerHTML = `<tr><td colspan="6" class="empty">No users found</td></tr>`; return; }
    body.innerHTML = list.map(u => `
      <tr>
        <td><div style="display:flex;align-items:center;gap:8px;"><div class="avatar" style="width:28px;height:28px;font-size:11px;">${initials(u.FullName||u.Username)}</div>${esc(u.FullName || u.Username)}</div></td>
        <td>${esc(u.Email) || '—'}</td>
        <td><span class="badge badge-blue">${esc(u.RoleName)}</span></td>
        <td><span class="badge ${u.Status==='active'?'badge-green':'badge-red'}">${u.Status}</span></td>
        <td>${u.LastLoginAt ? new Date(u.LastLoginAt).toLocaleString() : '—'}</td>
        <td style="text-align:right;">
          <button class="btn btn-outline btn-sm" onclick='editUser(${u.UserId})'>Edit</button>
          ${u.RoleName!=='SuperAdmin' ? `<button class="btn btn-danger btn-sm" onclick="deleteUser(${u.UserId})">Delete</button>` : ''}
        </td>
      </tr>
    `).join('');
  }

  document.getElementById('searchBox').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    renderUsers(allUsers.filter(u => (u.Username+u.Email+u.FullName).toLowerCase().includes(q)));
  });

  function openUserModal() {
    clearFieldErrors('userModalOverlay');
    document.getElementById('modalTitle').textContent = 'New User';
    document.getElementById('editUserId').value = '';
    document.getElementById('f_username').value = ''; document.getElementById('f_username').disabled = false;
    document.getElementById('f_fullName').value = '';
    document.getElementById('f_email').value = '';
    document.getElementById('f_password').value = '';
    document.getElementById('pwHint').textContent = '';
    document.getElementById('f_status').value = 'active';
    document.getElementById('userModalOverlay').classList.remove('hidden');
  }
  function closeUserModal() { document.getElementById('userModalOverlay').classList.add('hidden'); }

  function editUser(id) {
    clearFieldErrors('userModalOverlay');
    const u = allUsers.find(x => x.UserId === id);
    document.getElementById('modalTitle').textContent = 'Edit User';
    document.getElementById('editUserId').value = id;
    document.getElementById('f_username').value = u.Username; document.getElementById('f_username').disabled = true;
    document.getElementById('f_fullName').value = u.FullName || '';
    document.getElementById('f_email').value = u.Email || '';
    document.getElementById('f_password').value = '';
    document.getElementById('pwHint').textContent = '(leave blank to keep unchanged)';
    document.getElementById('f_role').value = u.RoleId;
    document.getElementById('f_status').value = u.Status;
    document.getElementById('userModalOverlay').classList.remove('hidden');
  }

  async function saveUser() {
    const id = document.getElementById('editUserId').value;
    const roleIdRaw = document.getElementById('f_role').value;
    const payload = {
      username: document.getElementById('f_username').value.trim(),
      fullName: document.getElementById('f_fullName').value.trim(),
      email: document.getElementById('f_email').value.trim(),
      password: document.getElementById('f_password').value,
      roleId: roleIdRaw ? parseInt(roleIdRaw) : null,
      status: document.getElementById('f_status').value
    };
    // Guard before hitting the network: an empty/unselected role dropdown
    // (e.g. the Roles list hadn't loaded yet) sends roleId as NaN, which
    // JSON.stringify silently turns into null — the server then rejects it
    // with a generic 422 that doesn't explain why. Catching it here gives
    // an immediate, specific message instead.
    if (!payload.roleId || isNaN(payload.roleId)) {
      showFieldErrors('userModalOverlay', USER_FIELD_MAP, { message: 'Please select a role', errors: { roleId: 'Role is required' } });
      return;
    }
    const btn = document.querySelector('#userModalOverlay .btn-primary');
    btn.disabled = true;
    try {
      if (id) { await api('/users/' + id, { method: 'PUT', body: payload }); toast('User updated', 'success'); }
      else { await api('/users', { method: 'POST', body: payload }); toast('User created', 'success'); }
      closeUserModal(); load();
    } catch (e) { showFieldErrors('userModalOverlay', USER_FIELD_MAP, e); }
    finally { btn.disabled = false; }
  }

  // Field-key -> input element id, so a server-side validation error like
  // {errors:{roleId:'...'}} highlights the actual dropdown instead of just
  // showing a vague top-level toast the user can't act on.
  const USER_FIELD_MAP = { username: 'f_username', fullName: 'f_fullName', email: 'f_email', password: 'f_password', roleId: 'f_role', status: 'f_status' };

  async function deleteUser(id) {
    if (!confirm('Delete this user?')) return;
    try { await api('/users/' + id, { method: 'DELETE' }); toast('User deleted', 'success'); load(); }
    catch (e) { toast(e.message, 'error'); }
  }

  load();
</script>
</body>
</html>
