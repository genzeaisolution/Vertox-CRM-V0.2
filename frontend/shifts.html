<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Shifts — Vertox CRM</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/layout.js"></script>
<script>
  requireAuthPage();
  renderLayout('shifts', 'Volunteer Shifts', 'Schedule and track volunteer shifts — clashing times are blocked automatically');
</script>

<template id="tpl">
  <div class="toolbar">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <input class="input" type="date" id="fFrom" style="width:150px;" title="From date">
      <span style="color:var(--ink-faint);font-size:12.5px;">to</span>
      <input class="input" type="date" id="fTo" style="width:150px;" title="To date">
      <select class="select" id="fVolunteer" style="width:180px;"><option value="">All volunteers</option></select>
      <select class="select" id="fStatus" style="width:150px;">
        <option value="">All statuses</option>
        <option>Scheduled</option><option>Completed</option><option>No-Show</option><option>Cancelled</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="loadShifts()">Apply</button>
      <button class="btn btn-outline btn-sm" onclick="clearFilters()">Clear</button>
    </div>
    <button class="btn btn-primary" id="newShiftBtn" onclick="openShiftModal()">+ Schedule Shift</button>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>Date</th><th>Time</th><th>Volunteer</th><th>Project</th><th>Role</th><th>Location</th><th>Status</th><th></th></tr></thead>
      <tbody id="shiftsBody"></tbody>
    </table>
  </div>
</template>

<div class="modal-overlay hidden" id="shiftModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="shiftModalTitle">Schedule Shift</div>
      <button class="close-x" onclick="closeShiftModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="s_id">
      <div class="field"><label class="label">Volunteer *</label><select class="select" id="s_volunteer" data-field="volunteerRecordId"></select></div>
      <div class="field"><label class="label">Project / Program</label><select class="select" id="s_project" data-field="projectRecordId"><option value="">(none)</option></select></div>
      <div class="field"><label class="label">Shift Date *</label><input class="input" type="date" id="s_date" data-field="shiftDate"></div>
      <div style="display:flex;gap:10px;">
        <div class="field" style="flex:1;"><label class="label">Start Time *</label><input class="input" type="time" id="s_start" data-field="startTime"></div>
        <div class="field" style="flex:1;"><label class="label">End Time *</label><input class="input" type="time" id="s_end" data-field="endTime"></div>
      </div>
      <div class="field"><label class="label">Role</label><input class="input" id="s_role" data-field="role" placeholder="e.g. Registration Desk"></div>
      <div class="field"><label class="label">Location</label><input class="input" id="s_location" data-field="location"></div>
      <div class="field"><label class="label">Status</label>
        <select class="select" id="s_status" data-field="status">
          <option>Scheduled</option><option>Completed</option><option>No-Show</option><option>Cancelled</option>
        </select>
      </div>
      <div class="field"><label class="label">Notes</label><textarea class="textarea" rows="2" id="s_notes" data-field="notes"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeShiftModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveShift()">Save</button>
    </div>
  </div>
</div>

<script>
  document.getElementById('pageContent').innerHTML = document.getElementById('tpl').innerHTML;

  const user = Store.user || {};
  const perms = user.permissions || [];
  const canManage = user.role === 'SuperAdmin' || perms.includes('shifts.manage');
  if (!canManage) document.getElementById('newShiftBtn')?.classList.add('hidden');

  let shifts = [], volunteers = [], projects = [];

  async function loadOptions() {
    volunteers = await api('/shifts/volunteers');
    const volSel = document.getElementById('s_volunteer');
    volSel.innerHTML = volunteers.map(v => `<option value="${v.RecordId}">${esc(v.Title) || '(untitled #' + v.RecordId + ')'}</option>`).join('') || `<option value="">No volunteers yet — add one in the Volunteers module first</option>`;
    const fVol = document.getElementById('fVolunteer');
    fVol.innerHTML = `<option value="">All volunteers</option>` + volunteers.map(v => `<option value="${v.RecordId}">${esc(v.Title)}</option>`).join('');

    try {
      const allRecords = await api('/records/projects');
      projects = allRecords;
      document.getElementById('s_project').innerHTML = `<option value="">(none)</option>` + projects.map(p => `<option value="${p.recordId}">${esc(p.title)}</option>`).join('');
    } catch (e) { /* projects module might be renamed/removed — non-critical */ }
  }

  function fmtTime(t) { return t; }

  async function loadShifts() {
    try {
      const params = {};
      const from = document.getElementById('fFrom').value; if (from) params.from = from;
      const to = document.getElementById('fTo').value; if (to) params.to = to;
      const vol = document.getElementById('fVolunteer').value; if (vol) params.volunteerRecordId = vol;
      const status = document.getElementById('fStatus').value; if (status) params.status = status;
      const qs = new URLSearchParams(params).toString();

      shifts = await api('/shifts' + (qs ? '?' + qs : ''));
      const body = document.getElementById('shiftsBody');
      if (shifts.length === 0) { body.innerHTML = `<tr><td colspan="8" class="empty">No shifts scheduled yet</td></tr>`; return; }
      const statusBadge = { Scheduled: 'badge-blue', Completed: 'badge-green', 'No-Show': 'badge-red', Cancelled: 'badge-gray' };
      body.innerHTML = shifts.map(s => `
        <tr>
          <td>${new Date(s.ShiftDate).toLocaleDateString()}</td>
          <td>${fmtTime(s.StartTime)} – ${fmtTime(s.EndTime)}</td>
          <td>${esc(s.VolunteerName) || '—'}</td>
          <td>${esc(s.ProjectName) || '—'}</td>
          <td>${esc(s.Role) || '—'}</td>
          <td>${esc(s.Location) || '—'}</td>
          <td><span class="badge ${statusBadge[s.Status] || 'badge-gray'}">${esc(s.Status)}</span></td>
          <td style="text-align:right;">
            ${canManage ? `<button class="btn btn-outline btn-sm" onclick="editShift(${s.ShiftId})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteShift(${s.ShiftId})">Delete</button>` : ''}
          </td>
        </tr>
      `).join('');
    } catch (e) { toast(e.message, 'error'); }
  }

  function clearFilters() {
    document.getElementById('fFrom').value = ''; document.getElementById('fTo').value = '';
    document.getElementById('fVolunteer').value = ''; document.getElementById('fStatus').value = '';
    loadShifts();
  }

  function todayStr() { return new Date().toISOString().slice(0, 10); }

  function openShiftModal() {
    document.getElementById('shiftModalTitle').textContent = 'Schedule Shift';
    document.getElementById('s_id').value = '';
    document.getElementById('s_volunteer').value = volunteers[0]?.RecordId || '';
    document.getElementById('s_project').value = '';
    document.getElementById('s_date').value = todayStr();
    document.getElementById('s_start').value = '09:00';
    document.getElementById('s_end').value = '13:00';
    document.getElementById('s_role').value = '';
    document.getElementById('s_location').value = '';
    document.getElementById('s_status').value = 'Scheduled';
    document.getElementById('s_notes').value = '';
    document.getElementById('shiftModalOverlay').classList.remove('hidden');
  }
  function closeShiftModal() { document.getElementById('shiftModalOverlay').classList.add('hidden'); }

  function editShift(id) {
    const s = shifts.find(x => x.ShiftId === id);
    if (!s) return;
    document.getElementById('shiftModalTitle').textContent = 'Edit Shift';
    document.getElementById('s_id').value = s.ShiftId;
    document.getElementById('s_volunteer').value = s.VolunteerRecordId;
    document.getElementById('s_project').value = s.ProjectRecordId || '';
    document.getElementById('s_date').value = new Date(s.ShiftDate).toISOString().slice(0, 10);
    document.getElementById('s_start').value = s.StartTime;
    document.getElementById('s_end').value = s.EndTime;
    document.getElementById('s_role').value = s.Role || '';
    document.getElementById('s_location').value = s.Location || '';
    document.getElementById('s_status').value = s.Status;
    document.getElementById('s_notes').value = s.Notes || '';
    document.getElementById('shiftModalOverlay').classList.remove('hidden');
  }

  async function saveShift() {
    const id = document.getElementById('s_id').value;
    const btn = document.querySelector('#shiftModalOverlay .btn-primary');
    if (btn.disabled) return;
    const payload = {
      volunteerRecordId: Number(document.getElementById('s_volunteer').value) || null,
      projectRecordId: document.getElementById('s_project').value ? Number(document.getElementById('s_project').value) : null,
      shiftDate: document.getElementById('s_date').value,
      startTime: document.getElementById('s_start').value,
      endTime: document.getElementById('s_end').value,
      role: document.getElementById('s_role').value.trim(),
      location: document.getElementById('s_location').value.trim(),
      status: document.getElementById('s_status').value,
      notes: document.getElementById('s_notes').value.trim()
    };
    btn.disabled = true;
    try {
      if (id) { await api('/shifts/' + id, { method: 'PUT', body: payload }); toast('Shift updated', 'success'); }
      else { await api('/shifts', { method: 'POST', body: payload }); toast('Shift scheduled', 'success'); }
      closeShiftModal(); loadShifts();
    } catch (e) { showFormErrors(e); }
    finally { btn.disabled = false; }
  }

  async function deleteShift(id) {
    if (!confirm('Delete this shift?')) return;
    try { await api('/shifts/' + id, { method: 'DELETE' }); toast('Shift deleted', 'success'); loadShifts(); }
    catch (e) { toast(e.message, 'error'); }
  }

  function showFormErrors(e) {
    document.querySelectorAll('.field-error').forEach(el => el.remove());
    document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
    const errors = e.errors || {};
    let matched = false;
    Object.entries(errors).forEach(([key, msg]) => {
      const el = document.querySelector(`[data-field="${key}"]`);
      if (el) {
        matched = true;
        el.classList.add('input-error');
        const hint = document.createElement('div');
        hint.className = 'field-error';
        hint.textContent = msg;
        el.insertAdjacentElement('afterend', hint);
      }
    });
    toast(matched ? 'Please fix the highlighted fields' : e.message, 'error');
  }

  (async function init() {
    await loadOptions();
    await loadShifts();
  })();
</script>
</body>
</html>
