<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Vertox CRM</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<style>
  html,body{height:100%;}
  body{
    font-family:var(--font);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 16px 24px;position:relative;overflow-x:hidden;
    background:linear-gradient(150deg,var(--blue-900) 0%,var(--blue-800) 42%,var(--blue-700) 78%,var(--blue-600) 100%);
  }
  /* soft white shading worked into the blue, not a separate white panel */
  body::before{
    content:'';position:fixed;top:-180px;left:50%;transform:translateX(-50%);
    width:900px;height:900px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 60%);
  }
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;opacity:.09;
    background-image:radial-gradient(#fff 1.4px,transparent 1.4px);background-size:26px 26px;
  }

  .auth-center{width:100%;max-width:1000px;display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center;position:relative;z-index:1;}

  .auth-brandline{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
  .auth-logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--blue-500),#8FBBFF);display:flex;align-items:center;justify-content:center;color:var(--blue-900);font-weight:800;font-size:20px;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);}
  .auth-brand-name{font-size:19px;font-weight:800;color:#fff;letter-spacing:.2px;}
  .auth-brand-sub{font-size:10.5px;color:#B9CDEE;letter-spacing:1.6px;text-transform:uppercase;margin-top:1px;}

  /* ---- Centered card ---- */
  .auth-card{
    width:400px;max-width:100%;background:#fff;border-radius:18px;
    box-shadow:0 30px 70px -12px rgba(6,26,54,.45);padding:34px 34px 28px;
    position:relative;overflow:hidden;
  }
  .auth-card::before{
    content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);
    width:260px;height:200px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(27,99,196,.12) 0%, transparent 70%);
  }
  .auth-card-topbar{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--blue-900),var(--blue-600),#5EA1FF);}

  .auth-card-head{text-align:center;position:relative;z-index:1;margin-bottom:22px;}
  .auth-card-head h2{font-size:22px;font-weight:800;color:var(--blue-900);}
  .auth-card-head p{font-size:12.5px;color:var(--ink-soft);margin-top:5px;}

  .err-box{background:#FDEDED;color:var(--danger);padding:10px 13px;border-radius:9px;font-size:12.5px;margin-bottom:16px;display:none;align-items:center;gap:8px;position:relative;z-index:1;}
  .field{margin-bottom:16px;position:relative;z-index:1;}
  .label{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block;}
  .input-wrap{position:relative;}
  .input-wrap .ic-left{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);display:flex;pointer-events:none;}
  .input-wrap .ic-left svg{width:16px;height:16px;}
  .input-wrap .input{padding-left:36px;background:var(--blue-50);font-size:16px;}
  .input-wrap .input:focus{border-color:var(--blue-600);box-shadow:0 0 0 3px rgba(27,99,196,.14);outline:none;background:#fff;}

  .btn-full{width:100%;justify-content:center;padding:12px;font-size:14px;position:relative;z-index:1;}
  .auth-trust-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;font-size:11.5px;color:var(--ink-faint);position:relative;z-index:1;}
  .auth-trust-row svg{width:13px;height:13px;color:var(--success);}

  /* ---- Footer: pinned to the bottom of the page, not the card ---- */
  .page-footer-brand{
    width:100%;text-align:center;padding:22px 16px 4px;position:relative;z-index:1;
  }
  .page-footer-brand .badge-pill{
    display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    color:#EAF1FF;font-weight:700;font-size:11.5px;backdrop-filter:blur(2px);
  }
  .page-footer-brand .badge-pill strong{color:#fff;}

  @media(max-width:460px){
    .auth-card{padding:28px 22px 24px;}
  }
</style>
</head>
<body>
<script src="js/icons.js"></script>

<div class="auth-center">
  <div class="auth-brandline">
    <div class="auth-logo">V</div>
    <div>
      <div class="auth-brand-name">Vertox CRM</div>
      <div class="auth-brand-sub">NGO Management Suite</div>
    </div>
  </div>

  <div class="auth-card">
    <div class="auth-card-topbar"></div>
    <div class="auth-card-head">
      <h2>Welcome back</h2>
      <p>Sign in to access your dashboard</p>
    </div>

    <div class="err-box" id="errBox"></div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label class="label">Username</label>
        <div class="input-wrap">
          <span class="ic-left" id="userIcon"></span>
          <input class="input" id="username" name="username" placeholder="e.g. genzeadmin" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="field" style="margin-bottom:6px;">
        <label class="label">Password</label>
        <div class="input-wrap">
          <span class="ic-left" id="lockIcon"></span>
          <input class="input" id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button class="btn btn-primary btn-full" type="submit" id="loginBtn" style="margin-top:18px;">Sign In</button>
    </form>

    <div class="auth-trust-row" id="trustRow"></div>
  </div>
</div>

<div class="page-footer-brand">
  <span class="badge-pill">Powered by <strong>GenZe Automation Integrate Solutions</strong> — GAIS</span>
</div>

<script src="js/api.js"></script>
<script>
  document.getElementById('userIcon').innerHTML = icon('user', 16);
  document.getElementById('lockIcon').innerHTML = icon('key', 16);
  document.getElementById('trustRow').innerHTML = icon('check', 13) + ' Encrypted &amp; access-logged sign-in';

  if (Store.accessToken) window.location.href = 'dashboard';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('errBox');
    errBox.style.display = 'none';
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in...';

    try {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const data = await api('/auth/login', { method: 'POST', body: { username, password }, auth: false });
      Store.accessToken = data.accessToken;
      Store.refreshToken = data.refreshToken;

      const me = await api('/auth/me');
      Store.user = { ...data.user, permissions: me.permissions };

      window.location.href = 'dashboard';
    } catch (err) {
      errBox.style.display = 'flex';
      errBox.innerHTML = icon('alert', 14) + ' <span>' + (err.message || 'Login failed. Please check your credentials.') + '</span>';
    } finally {
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
